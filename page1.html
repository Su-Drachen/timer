<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>词条统计 - 私人时间记录器</title>
    <!-- 使用 Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .transition-all {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 针对超长文本的展开/折叠过渡 */
        .remark-clamp {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .remark-expanded {
            display: block;
            -webkit-line-clamp: unset;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            '50': '#eff6ff', '100': '#dbeafe', '200': '#bfdbfe', '300': '#93c5fd', '400': '#60a5fa', '500': '#3b82f6', '600': '#2563eb', '700': '#1d4ed8', '800': '#1e40af', '900': '#1e3a8a',
                        },
                        success: '#22c55e',
                        danger: '#ef4444',
                        warning: '#f97316',
                        gold: '#f59e0b',
                        silver: '#94a3b8',
                        bronze: '#d97706',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans antialiased text-slate-800">

    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-3xl mx-auto px-3 sm:px-4 py-3 sm:py-4 flex justify-between items-center">
            <h1 class="text-base sm:text-xl font-bold text-slate-800 flex items-center">
                <i class="fa fa-bar-chart text-primary-500 mr-2 sm:mr-3 text-lg sm:text-xl"></i>
                <span>备注词条统计</span>
            </h1>
            <a href="pagemain.html" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 text-xs sm:text-sm font-medium py-1.5 px-2.5 sm:px-3.5 rounded-lg transition-colors flex items-center">
                <i class="fa fa-arrow-left mr-1.5"></i>
                返回主页
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- 头部说明与控制区 -->
            <div class="p-3.5 sm:p-5 border-b border-slate-100 bg-white">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h2 class="text-base sm:text-lg font-semibold text-slate-800">词条统计排行</h2>
                        <p class="text-xs text-slate-400 mt-0.5">点击长词条可展开查看全文</p>
                    </div>
                    <span id="stats-badge" class="text-xs font-medium px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full shrink-0">统计中...</span>
                </div>

                <!-- 搜索与筛选工具栏（适配移动端） -->
                <div id="filter-controls" class="hidden flex-col sm:flex-row gap-2 pt-2 border-t border-slate-100">
                    <!-- 搜索框 -->
                    <div class="relative flex-1">
                        <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs sm:text-sm"></i>
                        <input
                            type="text"
                            id="search-input"
                            placeholder="搜索词条内容..."
                            class="w-full pl-8 pr-8 py-1.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-all placeholder:text-slate-400"
                            oninput="handleSearch(this.value)"
                        >
                        <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs p-1">
                            <i class="fa fa-times-circle"></i>
                        </button>
                    </div>

                    <!-- 排序选择器 -->
                    <div class="flex items-center gap-1.5 shrink-0">
                        <div class="relative w-full sm:w-auto">
                            <select
                                id="sort-select"
                                onchange="handleSortChange(this.value)"
                                class="w-full sm:w-auto appearance-none bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm py-1.5 pl-3 pr-8 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 cursor-pointer"
                            >
                                <option value="count_desc">频次：从高到低</option>
                                <option value="count_asc">频次：从低到高</option>
                                <option value="time_desc">时间：最近记录优先</option>
                                <option value="time_asc">时间：最早记录优先</option>
                            </select>
                            <i class="fa fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内容/表格区域 -->
            <div id="stats-container" class="p-0 sm:p-2">
                <p class="text-slate-500 text-center py-8 text-sm">正在检查配置...</p>
            </div>
        </div>
    </main>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 flex items-center text-white py-2.5 px-4 rounded-xl shadow-lg opacity-0 pointer-events-none translate-y-6 z-50 transition-all text-sm max-w-[90vw]">
        <div id="toast-icon" class="mr-2.5"></div>
        <p id="toast-message" class="truncate"></p>
    </div>

    <footer class="text-slate-400 py-4 mt-auto">
        <div class="container mx-auto px-4 text-center text-xs">
            © 私人时间记录器
        </div>
    </footer>

    <script>
        let config = { GITHUB_USERNAME: "", GIST_ID: "", GITHUB_PAT: "" };
        let records = [];
        let allStats = []; // 存储统计好的词条原始聚合数据
        let searchQuery = "";
        let sortType = "count_desc";

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function readTimeRecorderConfig() {
            let stored = {};
            try {
                const savedConfig = localStorage.getItem('timeRecorderConfig');
                stored = savedConfig ? JSON.parse(savedConfig) : {};
            } catch (error) {
                console.warn('读取云端配置失败', error);
            }
            let sessionPat = sessionStorage.getItem('timeRecorderPat');
            if (stored.GITHUB_PAT) {
                if (!sessionPat) {
                    sessionPat = stored.GITHUB_PAT;
                    try { sessionStorage.setItem('timeRecorderPat', sessionPat); } catch (error) { console.warn('无法迁移会话令牌', error); }
                }
                delete stored.GITHUB_PAT;
                try { localStorage.setItem('timeRecorderConfig', JSON.stringify(stored)); } catch (error) { console.warn('无法更新云端配置', error); }
            }
            return { ...stored, GITHUB_PAT: sessionPat || stored.GITHUB_PAT || '' };
        }

        function loadConfig() {
            config = readTimeRecorderConfig();
            if (config.GIST_ID && config.GITHUB_PAT) {
                return true;
            } else {
                const container = document.getElementById('stats-container');
                document.getElementById('stats-badge').style.display = 'none';
                container.innerHTML = `
                    <div class="text-center py-10 px-4">
                        <i class="fa fa-cogs text-3xl sm:text-4xl text-warning mb-3"></i>
                        <h3 class="text-base font-semibold text-slate-700">云端配置不完整</h3>
                        <p class="text-xs sm:text-sm text-slate-500 my-2">请在时间笔记中补充 Gist ID 和当前会话令牌</p>
                        <a href="pagemain.html?tab=gist&config=1" class="mt-3 inline-block bg-primary-500 text-white text-sm py-1.5 px-4 rounded-lg hover:bg-primary-600 transition-colors font-medium">
                            前往云端配置
                        </a>
                    </div>
                `;
                return false;
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;
            toast.classList.remove('bg-success', 'bg-danger', 'bg-slate-800', 'bg-warning');

            let iconHtml = '';
            switch (type) {
                case 'success':
                    toast.classList.add('bg-success');
                    iconHtml = '<i class="fa fa-check-circle"></i>';
                    break;
                case 'error':
                    toast.classList.add('bg-danger');
                    iconHtml = '<i class="fa fa-times-circle"></i>';
                    break;
                case 'warning':
                    toast.classList.add('bg-warning');
                    iconHtml = '<i class="fa fa-exclamation-triangle"></i>';
                    break;
                default:
                    toast.classList.add('bg-slate-800');
                    iconHtml = '<i class="fa fa-info-circle"></i>';
            }
            toastIcon.innerHTML = iconHtml;

            toast.classList.remove('opacity-0', 'translate-y-6', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-6', 'pointer-events-none');
            }, 2500);
        }

        async function loadRecordsFromGist() {
            if (!config.GIST_ID || !config.GITHUB_PAT) return;

            document.getElementById('stats-container').innerHTML = `
                <div class="flex justify-center items-center py-12 text-slate-500 text-sm">
                    <i class="fa fa-spinner fa-spin text-xl mr-2 text-primary-500"></i>
                    <span>正在同步数据...</span>
                </div>
            `;

            try {
                const response = await fetch(`https://api.github.com/gists/${encodeURIComponent(config.GIST_ID)}`, {
                    headers: { 'Authorization': `token ${config.GITHUB_PAT}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-store'
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.message || `无法加载 Gist (${response.status})`);
                const file = data.files && data.files['records.json'];
                try {
                    records = file && file.content ? JSON.parse(file.content) : [];
                } catch (error) {
                    throw new Error('云端 records.json 格式无效');
                }
                if (!Array.isArray(records)) records = [];
                processRawRecords();
            } catch (error) {
                console.error("加载记录失败:", error);
                showToast("同步失败，请检查网络", "error");
                document.getElementById('stats-badge').style.display = 'none';
                document.getElementById('stats-container').innerHTML = `
                    <div class="text-center py-10 px-4 text-danger">
                        <i class="fa fa-cloud-download text-3xl mb-3"></i>
                        <h3 class="text-base font-semibold">数据同步失败</h3>
                        <p class="text-xs text-slate-500 my-2">请检查网络或 Gist 配置后重试</p>
                    </div>
                `;
            }
        }

        // 解析每条记录对应的时间戳
        function extractTimestamp(r) {
            const timeStr = r.endTime || r.startTime || r.date || r.timestamp || r.createTime || r.time;
            if (!timeStr) return 0;
            const t = new Date(timeStr).getTime();
            return isNaN(t) ? 0 : t;
        }

        // 处理并聚合词条数据
        function processRawRecords() {
            const container = document.getElementById('stats-container');
            const badge = document.getElementById('stats-badge');
            const controls = document.getElementById('filter-controls');

            if (records.length === 0) {
                badge.style.display = 'none';
                controls.classList.add('hidden');
                container.innerHTML = `
                    <div class="text-center py-10 px-4">
                        <i class="fa fa-folder-open-o text-3xl text-slate-300 mb-3"></i>
                        <h3 class="text-base font-medium text-slate-700">暂无任何记录</h3>
                    </div>
                `;
                return;
            }

            const map = new Map();

            records.forEach(record => {
                const remark = record.remark ? record.remark.trim() : '';
                if (remark) {
                    const time = extractTimestamp(record);
                    if (!map.has(remark)) {
                        map.set(remark, {
                            remark: remark,
                            count: 1,
                            latestTime: time,
                            earliestTime: time
                        });
                    } else {
                        const item = map.get(remark);
                        item.count += 1;
                        if (time > item.latestTime) item.latestTime = time;
                        if (time > 0 && (item.earliestTime === 0 || time < item.earliestTime)) item.earliestTime = time;
                    }
                }
            });

            if (map.size === 0) {
                badge.style.display = 'none';
                controls.classList.add('hidden');
                container.innerHTML = `
                    <div class="text-center py-10 px-4">
                        <i class="fa fa-commenting-o text-3xl text-slate-300 mb-3"></i>
                        <h3 class="text-base font-medium text-slate-700">暂无带备注的记录</h3>
                        <p class="text-xs text-slate-400 mt-1">记录时间时添加备注，此处将生成词频统计</p>
                    </div>
                `;
                return;
            }

            allStats = Array.from(map.values());
            controls.classList.remove('hidden');
            controls.classList.add('flex');
            renderStats();
        }

        function handleSearch(val) {
            searchQuery = (val || '').trim().toLowerCase();
            const clearBtn = document.getElementById('clear-search-btn');
            if (searchQuery) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderStats();
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            handleSearch('');
        }

        function handleSortChange(val) {
            sortType = val;
            renderStats();
        }

        function getRankBadge(index) {
            const rank = index + 1;
            if (rank === 1) {
                return `<span class="inline-flex items-center justify-center w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-gold text-white font-bold text-xs shadow-sm"><i class="fa fa-trophy text-[11px]"></i></span>`;
            }
            if (rank === 2) {
                return `<span class="inline-flex items-center justify-center w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-silver text-white font-bold text-xs shadow-sm">2</span>`;
            }
            if (rank === 3) {
                return `<span class="inline-flex items-center justify-center w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-bronze text-white font-bold text-xs shadow-sm">3</span>`;
            }
            return `<span class="text-slate-400 font-medium text-xs sm:text-sm">${rank}</span>`;
        }

        function toggleRemark(elementId) {
            const el = document.getElementById(elementId);
            const btn = document.getElementById('btn-' + elementId);
            if (!el) return;
            if (el.classList.contains('remark-clamp')) {
                el.classList.remove('remark-clamp');
                el.classList.add('remark-expanded');
                if (btn) btn.innerHTML = '收起 <i class="fa fa-angle-up"></i>';
            } else {
                el.classList.remove('remark-expanded');
                el.classList.add('remark-clamp');
                if (btn) btn.innerHTML = '展开 <i class="fa fa-angle-down"></i>';
            }
        }

        function renderStats() {
            const container = document.getElementById('stats-container');
            const badge = document.getElementById('stats-badge');

            // 1. 关键词过滤
            let filtered = allStats.filter(item => {
                if (!searchQuery) return true;
                return item.remark.toLowerCase().includes(searchQuery);
            });

            // 2. 排序
            filtered.sort((a, b) => {
                if (sortType === 'count_desc') {
                    return b.count - a.count || b.latestTime - a.latestTime;
                } else if (sortType === 'count_asc') {
                    return a.count - b.count || a.latestTime - b.latestTime;
                } else if (sortType === 'time_desc') {
                    return b.latestTime - a.latestTime || b.count - a.count;
                } else if (sortType === 'time_asc') {
                    return a.earliestTime - b.earliestTime || b.count - a.count;
                }
                return b.count - a.count;
            });

            badge.style.display = 'inline-block';
            if (searchQuery) {
                badge.textContent = `匹配 ${filtered.length} / 共 ${allStats.length} 个`;
            } else {
                badge.textContent = `共 ${allStats.length} 个词条`;
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 px-4">
                        <i class="fa fa-search text-3xl text-slate-300 mb-2"></i>
                        <p class="text-sm text-slate-500">未找到匹配“${escapeHtml(searchQuery)}”的词条</p>
                    </div>
                `;
                return;
            }

            // 构建响应式表格
            let tableHtml = `
                <div class="w-full overflow-hidden">
                    <table class="w-full text-left border-collapse table-fixed">
                        <thead>
                            <tr class="border-b border-slate-100 bg-slate-50/75 text-slate-500 text-xs">
                                <th class="w-12 sm:w-16 py-2.5 sm:py-3 text-center font-medium">序号</th>
                                <th class="py-2.5 sm:py-3 px-2 font-medium">词条内容</th>
                                <th class="w-16 sm:w-24 py-2.5 sm:py-3 text-center font-medium">频次</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-xs sm:text-sm">
            `;

            filtered.forEach((stat, index) => {
                const isLong = stat.remark.length > 35;
                const uniqueId = `remark-${index}`;
                const safeRemark = escapeHtml(stat.remark);

                tableHtml += `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="py-3 px-1 text-center align-top">
                            <div class="pt-0.5">${getRankBadge(index)}</div>
                        </td>
                        <td class="py-3 px-2 align-top break-words break-all">
                            <div id="${uniqueId}" class="${isLong ? 'remark-clamp cursor-pointer' : ''} text-slate-800 font-medium leading-relaxed" onclick="${isLong ? `toggleRemark('${uniqueId}')` : ''}">
                                ${safeRemark}
                            </div>
                            ${isLong ? `
                                <button id="btn-${uniqueId}" onclick="toggleRemark('${uniqueId}')" class="text-primary-600 text-[11px] font-normal hover:underline mt-1 inline-flex items-center gap-1 focus:outline-none">
                                    展开 <i class="fa fa-angle-down"></i>
                                </button>
                            ` : ''}
                        </td>
                        <td class="py-3 px-1 sm:px-2 text-center align-top whitespace-nowrap">
                            <span class="inline-block bg-primary-50 text-primary-600 font-semibold px-2 py-0.5 rounded-full text-xs border border-primary-100/60">
                                ${stat.count} 次
                            </span>
                        </td>
                    </tr>
                `;
            });

            tableHtml += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = tableHtml;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (loadConfig()) {
                loadRecordsFromGist();
            }
        });
    </script>
</body>
</html>
