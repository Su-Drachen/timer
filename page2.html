<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成就与徽章 - 私人时间记录器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            '50': '#eff6ff', '100': '#dbeafe', '500': '#3b82f6', '600': '#2563eb', '700': '#1d4ed8'
                        },
                        success: '#10b981',
                        danger: '#ef4444',
                        gold: '#f59e0b',
                    },
                }
            }
        }
    </script>
    <style>
        .achievement-card {
            transition: all 0.2s ease-out;
        }
        .achievement-card:active {
            transform: scale(0.97);
        }
        .achievement-card.locked {
            filter: grayscale(85%);
            opacity: 0.65;
        }
        .achievement-card.locked:hover {
            opacity: 0.85;
            filter: grayscale(40%);
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans antialiased text-slate-800">

    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-4xl mx-auto px-3 sm:px-4 py-3 sm:py-4 flex justify-between items-center">
            <h1 class="text-base sm:text-lg font-bold text-slate-800 flex items-center">
                <i class="fa fa-trophy text-gold mr-2 text-lg sm:text-xl"></i>
                <span>成就与徽章</span>
            </h1>
            <a href="pagemain.html" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 text-xs sm:text-sm font-medium py-1.5 px-3 rounded-lg transition-colors flex items-center">
                <i class="fa fa-arrow-left mr-1.5"></i>
                返回主页
            </a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-2.5 sm:px-4 py-3 sm:py-6 space-y-3 sm:space-y-4">

        <!-- 总成就进度卡片 -->
        <div id="overall-progress-container" class="bg-white p-3.5 sm:p-5 rounded-xl shadow-sm border border-slate-200 hidden">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-2">
                    <span class="text-xs sm:text-sm font-bold text-slate-800">成就总览</span>
                    <span id="overall-tag" class="text-[10px] sm:text-xs font-semibold px-2 py-0.5 rounded-full bg-primary-50 text-primary-600">计算中</span>
                </div>
                <span id="overall-progress-text" class="text-xs sm:text-sm font-bold text-primary-600">0 / 0 (0%)</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2.5 sm:h-3 overflow-hidden shadow-inner">
                <div id="overall-progress-bar" class="bg-gradient-to-r from-primary-500 to-indigo-500 h-full rounded-full transition-all duration-500" style="width: 0%;"></div>
            </div>

            <!-- 移动端友好的分类筛选 Pills -->
            <div class="flex gap-2 mt-3 pt-3 border-t border-slate-100 text-xs">
                <button onclick="AchievementSystem.setFilter('all')" id="filter-all" class="flex-1 py-1 px-2 rounded-lg font-medium bg-primary-500 text-white transition-all text-center">全部</button>
                <button onclick="AchievementSystem.setFilter('unlocked')" id="filter-unlocked" class="flex-1 py-1 px-2 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all text-center">已解锁</button>
                <button onclick="AchievementSystem.setFilter('locked')" id="filter-locked" class="flex-1 py-1 px-2 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all text-center">未解锁</button>
            </div>
        </div>

        <!-- 手机端 2 列网格，平板 3 列，PC 4 列 -->
        <div id="achievements-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-3.5">
            <p id="loading-message" class="text-slate-400 text-center py-12 col-span-full text-xs sm:text-sm">
                <i class="fa fa-spinner fa-spin mr-1"></i> 正在加载成就数据...
            </p>
        </div>

    </main>

    <!-- 弹窗详情 Modal (点击卡片展示完整说明) -->
    <div id="achievement-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-all duration-200" onclick="AchievementSystem.closeModal()">
        <div class="bg-white rounded-2xl max-w-xs sm:max-w-sm w-full p-5 shadow-2xl text-center transform scale-95 transition-all duration-200" onclick="event.stopPropagation()">
            <div id="modal-badge-wrapper" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl text-white mb-3 shadow-md">
                <i id="modal-icon" class="fa fa-trophy"></i>
            </div>
            <h3 id="modal-title" class="text-base font-bold text-slate-800">成就名称</h3>
            <p id="modal-desc" class="text-xs text-slate-600 mt-2 leading-relaxed">成就描述说明详情</p>

            <div class="my-4 p-3 bg-slate-50 rounded-xl border border-slate-100">
                <div class="flex justify-between text-xs font-semibold mb-1">
                    <span class="text-slate-500">当前进度</span>
                    <span id="modal-progress-num" class="text-slate-800">0 / 0</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div id="modal-progress-bar" class="h-full rounded-full transition-all" style="width: 0%;"></div>
                </div>
                <p id="modal-status-text" class="text-xs font-medium mt-2 text-slate-500">未解锁</p>
            </div>

            <button onclick="AchievementSystem.closeModal()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs sm:text-sm transition-colors">
                关闭
            </button>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 flex items-center text-white py-2.5 px-4 rounded-xl shadow-lg opacity-0 pointer-events-none translate-y-6 z-50 transition-all text-xs sm:text-sm">
        <p id="toast-message"></p>
    </div>

    <footer class="text-slate-400 py-4 mt-auto">
        <div class="container mx-auto px-4 text-center text-xs">
            © 私人时间记录器
        </div>
    </footer>

    <script>
        let config = {};
        let records = [];

        const DOMElements = {
            grid: null,
            loadingMessage: null,
            toast: null,
            toastMessage: null,
            overallProgress: {
                container: null,
                text: null,
                bar: null,
                tag: null,
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function readTimeRecorderConfig() {
            let stored = {};
            try {
                const savedConfig = localStorage.getItem('timeRecorderConfig');
                stored = savedConfig ? JSON.parse(savedConfig) : {};
            } catch (error) {
                console.warn('读取云端配置失败', error);
            }
            let sessionPat = sessionStorage.getItem('timeRecorderPat');
            if (stored.GITHUB_PAT) {
                if (!sessionPat) {
                    sessionPat = stored.GITHUB_PAT;
                    try { sessionStorage.setItem('timeRecorderPat', sessionPat); } catch (error) { console.warn('无法迁移会话令牌', error); }
                }
                delete stored.GITHUB_PAT;
                try { localStorage.setItem('timeRecorderConfig', JSON.stringify(stored)); } catch (error) { console.warn('无法更新云端配置', error); }
            }
            return { ...stored, GITHUB_PAT: sessionPat || stored.GITHUB_PAT || '' };
        }

        function loadConfig() {
            config = readTimeRecorderConfig();
            if (config.GIST_ID && config.GITHUB_PAT) {
                return true;
            } else {
                DOMElements.grid.innerHTML = `
                    <div class="col-span-full text-center bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-slate-200">
                        <i class="fa fa-cogs text-3xl text-warning mb-2"></i>
                        <h2 class="text-sm sm:text-base font-bold text-slate-800 mb-1">云端配置不完整</h2>
                        <p class="text-xs text-slate-500 mb-3">请在时间笔记中补充 Gist ID 和当前会话令牌。</p>
                        <a href="pagemain.html?tab=gist&config=1" class="inline-block bg-primary-500 text-white text-xs font-medium py-1.5 px-4 rounded-lg hover:bg-primary-600 transition-colors">前往云端配置</a>
                    </div>
                `;
                return false;
            }
        }

        function showToast(message, type = 'info') {
            const { toast, toastMessage } = DOMElements;
            toastMessage.textContent = message;
            toast.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 flex items-center text-white py-2.5 px-4 rounded-xl shadow-lg z-50 transition-all text-xs sm:text-sm';
            if (type === 'success') toast.classList.add('bg-success');
            else if (type === 'error') toast.classList.add('bg-danger');
            else toast.classList.add('bg-slate-800');

            toast.classList.remove('opacity-0', 'translate-y-6', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-6', 'pointer-events-none');
            }, 2500);
        }

        async function loadRecordsFromGist() {
            if (!config.GIST_ID || !config.GITHUB_PAT) return;
            try {
                const response = await fetch(`https://api.github.com/gists/${encodeURIComponent(config.GIST_ID)}`, {
                    headers: { 'Authorization': `token ${config.GITHUB_PAT}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-store'
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.message || `无法加载 Gist (${response.status})`);
                const file = data.files && data.files['records.json'];
                try {
                    records = file && file.content ? JSON.parse(file.content) : [];
                } catch (error) {
                    throw new Error('云端 records.json 格式无效');
                }
                if (!Array.isArray(records)) records = [];
                AchievementSystem.init(records);
            } catch (error) {
                console.error("加载记录失败:", error);
                showToast("同步失败，请检查配置或网络", "error");
                DOMElements.loadingMessage.textContent = '数据加载失败，请刷新页面重试。';
            }
        }

        /**
         * 成就系统核心逻辑
         */
        const AchievementSystem = {
            processedRecords: [],
            unlockedCount: 0,
            calculatedResults: [],
            currentFilter: 'all',

            createTieredAchievements(base, tiers) {
                return tiers.map((tier, index) => ({
                    ...base,
                    id: `${base.id}-${index + 1}`,
                    title: `${base.title} ${index + 1}阶`,
                    description: base.description.replace('{goal}', tier),
                    goal: tier,
                }));
            },

            getDefinitions() {
                const definitions = [
                    ...this.createTieredAchievements({
                        id: 'total-records', title: '初试牛刀', description: '累计完成 {goal} 条时间记录。',
                        icon: 'fa-pencil-square-o', color: 'bg-blue-500',
                        calculate: (recs) => recs.length,
                    }, [1, 10, 50, 100, 250, 500, 1000]),

                    ...this.createTieredAchievements({
                        id: 'consecutive-days', title: '持之以恒', description: '连续记录 {goal} 天。',
                        icon: 'fa-calendar-check-o', color: 'bg-rose-500',
                        calculate: (recs) => {
                            if (recs.length < 2) return recs.length;
                            const uniqueDays = [...new Set(recs.map(r => r.date.toISOString().split('T')[0]))].sort();
                            if (uniqueDays.length === 0) return 0;
                            let longest = 0, current = 1;
                            for (let i = 1; i < uniqueDays.length; i++) {
                                const prev = new Date(uniqueDays[i-1]);
                                const curr = new Date(uniqueDays[i]);
                                const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
                                if (diffDays === 1) current++;
                                else { longest = Math.max(longest, current); current = 1; }
                            }
                            return Math.max(longest, current);
                        }
                    }, [1, 3, 5, 7, 9, 11]),

                    {
                        id: 'legendary-aviator', title: '传奇机长', description: '连续记录达到 21 天。',
                        icon: 'fa-plane', goal: 21, color: 'bg-sky-600',
                        calculate: (recs) => {
                            if (recs.length < 2) return recs.length;
                            const uniqueDays = [...new Set(recs.map(r => r.date.toISOString().split('T')[0]))].sort();
                            if (uniqueDays.length === 0) return 0;
                            let longest = 0, current = 1;
                            for (let i = 1; i < uniqueDays.length; i++) {
                                const prev = new Date(uniqueDays[i-1]);
                                const curr = new Date(uniqueDays[i]);
                                const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
                                if (diffDays === 1) current++;
                                else { longest = Math.max(longest, current); current = 1; }
                            }
                            return Math.max(longest, current);
                        }
                    },

                    { id: 'early-bird', title: '闻鸡起舞', description: '在早上 5-8 点记录超过 20 次。', icon: 'fa-sun-o', goal: 20, color: 'bg-amber-500', calculate: recs => recs.filter(r => r.date.getHours() >= 5 && r.date.getHours() < 8).length },
                    { id: 'night-owl', title: '夜猫子', description: '在午夜后 (0-4点) 记录超过 20 次。', icon: 'fa-moon-o', goal: 20, color: 'bg-indigo-500', calculate: recs => recs.filter(r => r.date.getHours() >= 0 && r.date.getHours() < 4).length },

                    { id: 'workday-warrior', title: '工作日战士', description: '在周一至周五累计记录 100 次。', icon: 'fa-briefcase', goal: 100, color: 'bg-teal-500', calculate: recs => recs.filter(r => r.date.getDay() >= 1 && r.date.getDay() <= 5).length },
                    { id: 'weekend-winner', title: '周末赢家', description: '在周末累计记录 50 次。', icon: 'fa-glass', goal: 50, color: 'bg-purple-500', calculate: recs => recs.filter(r => r.date.getDay() === 0 || r.date.getDay() === 6).length },

                    ...this.createTieredAchievements({
                        id: 'daily-burst', title: '日积月累', description: '单日最高记录数达到 {goal} 条。',
                        icon: 'fa-star', color: 'bg-yellow-500',
                        calculate: recs => {
                            const counts = recs.reduce((acc, r) => {
                                const day = r.date.toISOString().split('T')[0];
                                acc[day] = (acc[day] || 0) + 1;
                                return acc;
                            }, {});
                            return Object.keys(counts).length > 0 ? Math.max(...Object.values(counts)) : 0;
                        }
                    }, [3, 5, 10]),

                    ...this.createTieredAchievements({
                        id: 'long-note', title: '长篇大论', description: '备注多于 50 个字符的记录达到 {goal} 条。',
                        icon: 'fa-file-text-o', color: 'bg-emerald-600',
                        calculate: recs => recs.filter(r => (r.remark || '').length > 50).length
                    }, [10, 50]),
                    { id: 'diversifier', title: '生活多彩', description: '记录过 10 种以上不同的事情 (基于备注首词)。', icon: 'fa-sitemap', goal: 10, color: 'bg-pink-500', calculate: recs => new Set(recs.map(r => (r.remark || '').split(' ')[0])).size },

                    { id: 'time-traveler', title: '跨年记录者', description: '在 2 个不同的年份都有记录。', icon: 'fa-history', goal: 2, color: 'bg-stone-500', calculate: recs => new Set(recs.map(r => r.date.getFullYear())).size },
                    ...this.createTieredAchievements({
                        id: 'monthly-records', title: '月度常客', description: '在 {goal} 个不同月份有过记录。',
                        icon: 'fa-calendar-plus-o', color: 'bg-cyan-700',
                        calculate: recs => new Set(recs.map(r => `${r.date.getFullYear()}-${r.date.getMonth()}`)).size
                    }, [3, 6, 12]),

                    {
                        id: 'health-conscious', title: '养生呢', description: '两次连续记录的间隔时间超过 15 天。',
                        icon: 'fa-leaf', goal: 1, color: 'bg-green-600',
                        calculate: recs => {
                            if (recs.length < 2) return 0;
                            const sortedRecs = [...recs].sort((a, b) => a.date - b.date);
                            let gapCount = 0;
                            for (let i = 1; i < sortedRecs.length; i++) {
                                const diffDays = (sortedRecs[i].date - sortedRecs[i-1].date) / (1000 * 60 * 60 * 24);
                                if (diffDays > 15) gapCount++;
                            }
                            return gapCount;
                        }
                    },
                ];

                const metaAchievements = [
                    ...this.createTieredAchievements({
                        id: 'meta-unlocker', title: '成就猎人', description: '解锁 {goal} 个其他成就。',
                        icon: 'fa-trophy', color: 'bg-gold',
                        calculate: (recs, unlocked) => unlocked
                    }, [10, 20])
                ];

                let allDefs = [...definitions, ...metaAchievements];
                allDefs.push({
                    id: 'meta-master', title: '成就大师', description: '解锁所有其他全部成就！',
                    icon: 'fa-diamond', color: 'bg-slate-900', goal: allDefs.length,
                    calculate: (recs, unlocked) => unlocked
                });

                return allDefs;
            },

            init(records) {
                this.processedRecords = records.map(r => ({
                    ...r,
                    date: new Date(r.time.replace(/\//g, '-'))
                })).filter(r => !isNaN(r.date.getTime()));

                this.calculateAll();
                this.render();
            },

            calculateAll() {
                const definitions = this.getDefinitions();
                this.calculatedResults = [];
                let unlockedCount = 0;

                definitions.forEach(ach => {
                    if (ach.id.startsWith('meta-')) return;
                    const currentValue = ach.calculate(this.processedRecords);
                    const isUnlocked = currentValue >= ach.goal;
                    if (isUnlocked) unlockedCount++;
                    this.calculatedResults.push({ ...ach, currentValue, isUnlocked });
                });

                definitions.forEach(ach => {
                    if (!ach.id.startsWith('meta-')) return;
                    const currentValue = ach.calculate(this.processedRecords, unlockedCount);
                    const isUnlocked = currentValue >= ach.goal;
                    if (isUnlocked) unlockedCount++;
                    this.calculatedResults.push({ ...ach, currentValue, isUnlocked });
                });

                this.unlockedCount = this.calculatedResults.filter(r => r.isUnlocked).length;

                // 排序：已解锁优先
                this.calculatedResults.sort((a,b) => (b.isUnlocked - a.isUnlocked) || a.title.localeCompare(b.title));
            },

            setFilter(type) {
                this.currentFilter = type;
                ['all', 'unlocked', 'locked'].forEach(t => {
                    const btn = document.getElementById(`filter-${t}`);
                    if (t === type) {
                        btn.className = "flex-1 py-1 px-2 rounded-lg font-medium bg-primary-500 text-white transition-all text-center shadow-xs";
                    } else {
                        btn.className = "flex-1 py-1 px-2 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all text-center";
                    }
                });
                this.renderGridOnly();
            },

            updateOverallProgress(unlocked, total) {
                const { container, text, bar, tag } = DOMElements.overallProgress;
                if (!container || !text || !bar) return;
                const percentage = total > 0 ? (unlocked / total) * 100 : 0;
                text.textContent = `${unlocked} / ${total} (${Math.floor(percentage)}%)`;
                bar.style.width = `${percentage}%`;
                tag.textContent = percentage === 100 ? '全部达成' : `已完成 ${Math.floor(percentage)}%`;
                container.classList.remove('hidden');
            },

            render() {
                this.updateOverallProgress(this.unlockedCount, this.calculatedResults.length);
                this.renderGridOnly();
            },

            renderGridOnly() {
                DOMElements.grid.innerHTML = '';
                let list = this.calculatedResults;
                if (this.currentFilter === 'unlocked') {
                    list = list.filter(r => r.isUnlocked);
                } else if (this.currentFilter === 'locked') {
                    list = list.filter(r => !r.isUnlocked);
                }

                if (list.length === 0) {
                    DOMElements.grid.innerHTML = `
                        <div class="col-span-full text-center py-10 text-slate-400 text-xs">
                            <i class="fa fa-inbox text-2xl mb-1"></i>
                            <p>该分类下暂无成就</p>
                        </div>
                    `;
                    return;
                }

                list.forEach((res, index) => {
                    const card = this.createCompactCard(res, index);
                    DOMElements.grid.appendChild(card);
                });
            },

            createCompactCard(data, index) {
                const { title, description, icon, color, goal, currentValue, isUnlocked } = data;
                const progressPercent = Math.min(Math.floor((currentValue / goal) * 100), 100);
                const safeColor = isUnlocked ? (color === 'bg-gold' ? 'bg-amber-400' : color) : 'bg-slate-400';

                const card = document.createElement('div');
                card.className = `achievement-card cursor-pointer bg-white rounded-xl p-3 sm:p-4 border border-slate-200/80 shadow-xs flex flex-col items-center text-center relative overflow-hidden ${isUnlocked ? 'border-primary-100' : 'locked'}`;

                // 绑定点击打开详情弹窗
                card.onclick = () => this.openModal(data);

                card.innerHTML = `
                    ${isUnlocked ? `
                        <div class="absolute top-1.5 right-1.5 text-gold text-xs">
                            <i class="fa fa-check-circle"></i>
                        </div>
                    ` : ''}

                    <div class="w-11 h-11 sm:w-13 sm:h-13 rounded-full flex items-center justify-center ${safeColor} text-white text-lg sm:text-xl shadow-xs mb-2">
                        <i class="fa ${icon}"></i>
                    </div>

                    <h3 class="text-xs sm:text-sm font-bold text-slate-800 truncate w-full mb-1">${escapeHtml(title)}</h3>
                    <p class="text-[11px] sm:text-xs text-slate-400 line-clamp-2 h-7 leading-tight mb-2">${escapeHtml(description)}</p>

                    <div class="w-full mt-auto">
                        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                            <div class="${isUnlocked ? 'bg-success' : 'bg-primary-500'} h-full rounded-full" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="flex justify-between items-center text-[10px] text-slate-400 font-medium mt-1">
                            <span>${isUnlocked ? '已达成' : `${currentValue}/${goal}`}</span>
                            <span>${progressPercent}%</span>
                        </div>
                    </div>
                `;
                return card;
            },

            openModal(data) {
                const { title, description, icon, color, goal, currentValue, isUnlocked } = data;
                const progressPercent = Math.min(Math.floor((currentValue / goal) * 100), 100);
                const safeColor = isUnlocked ? (color === 'bg-gold' ? 'bg-amber-400' : color) : 'bg-slate-400';

                const modal = document.getElementById('achievement-modal');
                const badge = document.getElementById('modal-badge-wrapper');
                const iconEl = document.getElementById('modal-icon');
                const bar = document.getElementById('modal-progress-bar');

                badge.className = `w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl text-white mb-3 shadow-md ${safeColor}`;
                iconEl.className = `fa ${icon}`;
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-desc').textContent = description;
                document.getElementById('modal-progress-num').textContent = `${currentValue} / ${goal}`;

                bar.style.width = `${progressPercent}%`;
                bar.className = `h-full rounded-full ${isUnlocked ? 'bg-success' : 'bg-primary-500'}`;

                const statusEl = document.getElementById('modal-status-text');
                if (isUnlocked) {
                    statusEl.innerHTML = `<span class="text-success font-semibold"><i class="fa fa-check-circle"></i> 已解锁该勋章</span>`;
                } else {
                    statusEl.innerHTML = `<span class="text-slate-500">还需完成 ${Math.max(0, goal - currentValue)} 即可解锁</span>`;
                }

                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            },

            closeModal() {
                const modal = document.getElementById('achievement-modal');
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-100');
                modal.querySelector('div').classList.add('scale-95');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            DOMElements.grid = document.getElementById('achievements-grid');
            DOMElements.loadingMessage = document.getElementById('loading-message');
            DOMElements.toast = document.getElementById('toast');
            DOMElements.toastMessage = document.getElementById('toast-message');
            DOMElements.overallProgress.container = document.getElementById('overall-progress-container');
            DOMElements.overallProgress.text = document.getElementById('overall-progress-text');
            DOMElements.overallProgress.bar = document.getElementById('overall-progress-bar');
            DOMElements.overallProgress.tag = document.getElementById('overall-tag');

            if (loadConfig()) {
                loadRecordsFromGist();
            }
        });
    </script>
</body>
</html>
