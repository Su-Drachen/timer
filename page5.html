<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>AI 健康顾问 - 私人时间记录器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    :root{color-scheme:light;--text:#202123;--muted:#6b6b6b;--line:#e5e5e5;--side:#f9f9f9;--hover:#ececec;--green:#10a37f}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
    button,input,textarea{font:inherit}button{color:inherit}.app{display:flex;width:100%;height:100vh;height:100dvh}
    .fa{font-family:inherit!important;font-style:normal}.fa:before{display:inline-block}.fa-plus:before{content:"+"}.fa-angle-left:before{content:"\2039"}.fa-pencil-square-o:before{content:"\270E"}.fa-line-chart:before{content:"\2197"}.fa-cog:before{content:"\2699"}.fa-arrow-left:before{content:"\2190"}.fa-bars:before{content:"\2630"}.fa-trash-o:before{content:"\232B"}.fa-paperclip:before{content:"\2295"}.fa-arrow-up:before{content:"\2191"}.fa-stop:before{content:"\25A0"}.fa-times:before{content:"\00D7"}.fa-file-o:before{content:"\25A4"}.fa-clone:before{content:"\25A7"}.fa-refresh:before{content:"\21BB"}.fa-circle-o-notch:before{content:"\25CC"}
    .sidebar{width:260px;flex:0 0 260px;display:flex;flex-direction:column;padding:8px;background:var(--side);border-right:1px solid rgba(0,0,0,.04);z-index:40}
    .brand-row,.topbar{display:flex;align-items:center;justify-content:space-between}.brand-row{height:44px;padding:0 4px 0 8px}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}.brand-mark,.avatar,.welcome-logo{display:grid;place-items:center;border-radius:50%;background:#111827;color:#fff}.brand-mark{width:28px;height:28px;font-size:13px}
    .icon-btn{width:36px;height:36px;border:0;border-radius:8px;background:transparent;display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto}.icon-btn:hover{background:var(--hover)}
    .new-chat,.side-link{width:100%;border:0;border-radius:8px;background:transparent;display:flex;align-items:center;gap:11px;cursor:pointer;text-align:left}.new-chat{height:42px;margin:6px 0 10px;padding:0 11px;font-size:14px;font-weight:500}.side-link{min-height:40px;padding:0 10px;font-size:13px;text-decoration:none}.new-chat:hover,.side-link:hover{background:var(--hover)}.new-chat i,.side-link i{width:18px;text-align:center;color:#666}
    .sessions{flex:1;min-height:0;overflow-y:auto;padding:0 2px;scrollbar-width:thin}.group-label{margin:16px 8px 7px;color:#888;font-size:11px;font-weight:600}
    .session{position:relative;width:100%;height:38px;padding:0 36px 0 10px;border:0;border-radius:8px;display:flex;align-items:center;background:transparent;cursor:pointer;text-align:left;font-size:13px}.session:hover,.session.active{background:var(--hover)}.session-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .session-delete{position:absolute;right:4px;top:3px;width:32px;height:32px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:#777;opacity:0}.session:hover .session-delete,.session.active .session-delete{opacity:1}.session-delete:hover{background:#ddd;color:#c5221f}
    .side-bottom{padding-top:8px;border-top:1px solid var(--line)}.status-dot{width:7px;height:7px;margin-left:auto;border-radius:50%;background:#f59e0b}.status-dot.ready{background:var(--green)}
    .overlay{display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.42)}
    .main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;background:#fff}.topbar{height:56px;flex:0 0 56px;padding:0 14px;background:rgba(255,255,255,.94);z-index:10}.top-left{display:flex;align-items:center;gap:7px;min-width:0}.menu{display:none}.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}.model{margin-left:6px;color:#888;font-size:12px;font-weight:400}
    .chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}.chat-content{width:min(100%,800px);min-height:100%;margin:auto;padding:18px 24px 34px}
    .welcome{min-height:calc(100dvh - 230px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 0}.welcome-logo{width:42px;height:42px;font-size:18px}.welcome h1{margin:18px 0 26px;font-size:24px;line-height:1.35;letter-spacing:0}
    .starters{width:min(100%,570px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.starter{min-height:64px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:left;line-height:1.4;font-size:13px}.starter:hover{background:#f7f7f7}.starter strong{display:block;margin-bottom:3px}.starter span{color:var(--muted);font-size:12px}
    .messages{display:flex;flex-direction:column;gap:26px}.message{width:100%;display:flex;gap:13px;animation:rise .18s ease-out}.message.user{justify-content:flex-end}@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .avatar{width:28px;height:28px;flex:0 0 28px;margin-top:2px;font-size:12px}.message-col{min-width:0;max-width:calc(100% - 41px)}.assistant-name{margin:0 0 7px;font-size:13px;font-weight:600}.message-body{font-size:15px;line-height:1.75;overflow-wrap:anywhere}.user .message-col{max-width:78%}.user .message-body{padding:9px 14px;border-radius:18px;background:#f4f4f4;line-height:1.55;white-space:pre-wrap}
    .file-label{display:inline-flex;align-items:center;gap:7px;max-width:100%;margin-bottom:7px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:12px}.file-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .msg-actions{height:30px;margin:5px 0 0 -7px;display:flex;opacity:0}.message:hover .msg-actions,.msg-actions:focus-within{opacity:1}.mini{width:30px;height:30px;border:0;border-radius:7px;display:grid;place-items:center;background:transparent;color:#777;cursor:pointer}.mini:hover{background:#f0f0f0;color:#222}
    .typing:after{content:"";display:inline-block;width:7px;height:16px;margin-left:3px;vertical-align:-2px;background:#555;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}.tool{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#777;font-size:12px}.tool i{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{color:#b42318}
    .markdown p{margin:0 0 13px}.markdown p:last-child{margin-bottom:0}.markdown h1,.markdown h2,.markdown h3{margin:20px 0 8px;line-height:1.35;letter-spacing:0}.markdown h1{font-size:20px}.markdown h2{font-size:18px}.markdown h3{font-size:16px}.markdown ul,.markdown ol{margin:6px 0 13px;padding-left:23px}.markdown li{margin:4px 0}.markdown pre{margin:12px 0;padding:14px;overflow-x:auto;border-radius:8px;background:#171717;color:#f5f5f5;font:13px/1.55 Consolas,monospace}.markdown code:not(pre code){padding:2px 5px;border-radius:5px;background:#f0f0f0;font:.9em Consolas,monospace}.markdown blockquote{margin:12px 0;padding-left:13px;border-left:3px solid #d2d2d2;color:#666}.markdown a{color:#087f5b;text-decoration:underline}.output-image{display:block;max-width:min(100%,560px);margin:12px 0;border-radius:8px}
    .composer-area{flex:0 0 auto;padding:0 18px max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 22px)}.composer-inner{width:min(100%,800px);margin:auto}.attach-preview{display:none;width:fit-content;max-width:100%;margin:0 0 7px 9px;padding:7px 8px 7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.attach-preview.show{display:flex;align-items:center;gap:8px}.attach-preview span{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.remove-file{border:0;background:transparent;cursor:pointer;color:#777}
    .composer{min-height:54px;padding:8px 8px 8px 7px;border:1px solid #d9d9d9;border-radius:26px;background:#fff;display:flex;align-items:flex-end;gap:5px;box-shadow:0 2px 12px rgba(0,0,0,.08)}.composer:focus-within{border-color:#aaa;box-shadow:0 3px 14px rgba(0,0,0,.1)}.attach-btn{width:38px;height:38px}
    #userInput{flex:1;min-width:0;height:38px;max-height:160px;padding:8px 5px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font-size:15px;line-height:22px}#userInput::placeholder{color:#8d8d8d}.send{width:38px;height:38px;border:0;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;cursor:pointer;flex:0 0 auto}.send:disabled{background:#e4e4e4;color:#999;cursor:default}.disclaimer{margin:7px 0 0;text-align:center;color:#888;font-size:10px;line-height:1.3}
    .toast{position:fixed;left:50%;bottom:104px;z-index:70;transform:translate(-50%,12px);padding:9px 13px;border-radius:8px;background:#222;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .modal-bg{display:none;position:fixed;inset:0;z-index:60;padding:18px;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}.modal-bg.show{display:flex}.modal{width:min(100%,460px);max-height:calc(100dvh - 36px);overflow:auto;padding:20px;border-radius:12px;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.2)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal h2{margin:0;font-size:17px;letter-spacing:0}.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:600}.field input{width:100%;height:40px;padding:0 11px;border:1px solid #d8d8d8;border-radius:8px;outline:0;font-size:13px}.field input:focus{border-color:#777;box-shadow:0 0 0 2px rgba(0,0,0,.05)}.note{margin:4px 0 18px;padding:10px;border-radius:8px;background:#f6f6f6;color:#666;font-size:11px;line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.btn{min-height:38px;padding:0 16px;border:1px solid #d5d5d5;border-radius:8px;background:#fff;cursor:pointer;font-size:13px}.btn:hover{background:#f5f5f5}.btn.primary{border-color:#111;background:#111;color:#fff}
    @media(max-width:767px){.sidebar{position:fixed;inset:0 auto 0 0;width:min(86vw,290px);transform:translateX(-102%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.12)}.sidebar.open{transform:none}.overlay.show{display:block}.menu{display:inline-grid}.topbar{height:52px;flex-basis:52px;padding:0 8px;border-bottom:1px solid #eee}.model{display:none}.chat-content{padding:15px 14px 28px}.welcome{min-height:calc(100dvh - 210px);padding:20px 0}.welcome h1{margin:14px 0 22px;font-size:21px}.starters{grid-template-columns:1fr;gap:8px}.starter{min-height:56px}.messages{gap:22px}.message-body{font-size:14px}.user .message-col{max-width:88%}.msg-actions{opacity:1}.composer-area{padding:0 9px max(7px,env(safe-area-inset-bottom))}.composer{min-height:50px;padding:6px;border-radius:23px}#userInput{font-size:16px}.disclaimer{margin-top:5px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app">
    <div id="overlay" class="overlay"></div>
    <aside id="sidebar" class="sidebar" aria-label="会话侧栏">
      <div class="brand-row"><div class="brand"><span class="brand-mark"><i class="fa fa-plus"></i></span><span>AI 健康顾问</span></div><button class="icon-btn" title="收起侧栏" aria-label="收起侧栏" onclick="toggleSidebar(false)"><i class="fa fa-angle-left"></i></button></div>
      <button class="new-chat" onclick="createNewChat()"><i class="fa fa-pencil-square-o"></i><span>新对话</span></button>
      <div id="sessionList" class="sessions"></div>
      <div class="side-bottom">
        <button class="side-link" onclick="startHealthAnalysis()"><i class="fa fa-line-chart"></i><span>分析最新记录</span></button>
        <button class="side-link" onclick="openSettings()"><i class="fa fa-cog"></i><span>清言 API 设置</span><span id="apiStatus" class="status-dot"></span></button>
        <a class="side-link" href="pagemain.html"><i class="fa fa-arrow-left"></i><span>返回主页</span></a>
      </div>
    </aside>
    <section class="main">
      <header class="topbar">
        <div class="top-left"><button class="icon-btn menu" title="打开侧栏" aria-label="打开侧栏" onclick="toggleSidebar(true)"><i class="fa fa-bars"></i></button><div id="chatTitle" class="title">AI 健康顾问<span class="model">清言智能体</span></div></div>
        <button class="icon-btn" title="清空当前对话" aria-label="清空当前对话" onclick="clearCurrentChat()"><i class="fa fa-trash-o"></i></button>
      </header>
      <main id="chatScroll" class="chat-scroll">
        <div class="chat-content">
          <section id="welcome" class="welcome">
            <div class="welcome-logo"><i class="fa fa-plus"></i></div><h1>今天想了解什么？</h1>
            <div class="starters">
              <button class="starter" onclick="startHealthAnalysis()"><strong>分析最新记录</strong><span>同步并评估最近的时间数据</span></button>
              <button class="starter" onclick="usePrompt('请你以喵宝的身份，根据我的情况，制定一份循序渐进的作息调整计划。')"><strong>制定作息计划</strong><span>获得可以执行的节律建议</span></button>
              <button class="starter" onclick="usePrompt('请你以喵宝的身份，怎样在不增加压力的情况下提高专注力？')"><strong>改善专注状态</strong><span>从习惯与恢复角度开始</span></button>
              <button class="starter" onclick="usePrompt('请你以喵宝的身份，请告诉我哪些健康信号需要及时就医。')"><strong>识别风险信号</strong><span>了解何时需要专业帮助</span></button>
            </div>
          </section>
          <div id="messages" class="messages"></div>
        </div>
      </main>
      <footer class="composer-area"><div class="composer-inner">
        <div id="attachPreview" class="attach-preview"><i class="fa fa-file-o"></i><span id="attachName"></span><button class="remove-file" title="移除附件" aria-label="移除附件" onclick="clearAttachment()"><i class="fa fa-times"></i></button></div>
        <div class="composer"><button class="icon-btn attach-btn" title="添加附件" aria-label="添加附件" onclick="document.getElementById('fileInput').click()"><i class="fa fa-paperclip"></i></button><input id="fileInput" type="file" hidden><textarea id="userInput" rows="1" placeholder="给 AI 健康顾问发送消息" aria-label="消息内容"></textarea><button id="sendButton" class="send" title="发送" aria-label="发送" disabled><i class="fa fa-arrow-up"></i></button></div>
        <p class="disclaimer">AI 可能会犯错。健康建议仅供参考，不能替代医生诊断。</p>
      </div></footer>
    </section>
  </div>
  <div id="settings" class="modal-bg" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal">
    <div class="modal-head"><h2 id="settingsTitle">清言 API 设置</h2><button class="icon-btn" title="关闭" aria-label="关闭" onclick="closeSettings()"><i class="fa fa-times"></i></button></div>
    <div class="field"><label for="cfgKey">API Key</label><input id="cfgKey" type="password" autocomplete="off" placeholder="开发者 API Key"></div>
    <div class="field"><label for="cfgSecret">API Secret</label><input id="cfgSecret" type="password" autocomplete="off" placeholder="开发者 API Secret"></div>
    <div class="field"><label for="cfgAssistant">Assistant ID</label><input id="cfgAssistant" type="text" autocomplete="off" placeholder="智能体 ID"></div>
    <div class="note">凭证只保存在当前浏览器中。</div>
    <div class="modal-actions"><button class="btn" onclick="closeSettings()">取消</button><button class="btn primary" onclick="saveSettings()">保存</button></div>
  </div></div>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const API_ROOT='https://chatglm.cn/chatglm/assistant-api/v1';
    const DEFAULT_ASSISTANT='6a8564e18bde79fad1950bf2';
    const DEFAULT_KEY='';
    const DEFAULT_SECRET='';
    const STORE={sessions:'health_chat_sessions',current:'health_current_session_id'};
    const $=id=>document.getElementById(id);
    const dom={sidebar:$('sidebar'),overlay:$('overlay'),sessionList:$('sessionList'),title:$('chatTitle'),welcome:$('welcome'),messages:$('messages'),scroll:$('chatScroll'),input:$('userInput'),send:$('sendButton'),file:$('fileInput'),preview:$('attachPreview'),fileName:$('attachName'),settings:$('settings'),apiStatus:$('apiStatus'),toast:$('toast')};
    const json=(value,fallback)=>{try{return JSON.parse(value)}catch{return fallback}};
    let sessions=json(localStorage.getItem(STORE.sessions),[]);
    if(!Array.isArray(sessions))sessions=[];
    sessions=sessions.map(s=>({...s,messages:Array.isArray(s.messages)?s.messages:[],conversationId:s.conversationId||null}));
    let currentId=localStorage.getItem(STORE.current)||null,selectedFile=null,generating=false,controller=null,cachedToken='',tokenExpiry=0,toastTimer;
    const config=()=>({apiKey:localStorage.getItem('glm_api_key')||DEFAULT_KEY,apiSecret:localStorage.getItem('glm_api_secret')||DEFAULT_SECRET,assistantId:localStorage.getItem('glm_assistant_id')||DEFAULT_ASSISTANT});
    const timeRecorderConfig=()=>{let stored=json(localStorage.getItem('timeRecorderConfig'),{}),sessionPat=sessionStorage.getItem('timeRecorderPat');if(stored.GITHUB_PAT){if(!sessionPat){sessionPat=stored.GITHUB_PAT;try{sessionStorage.setItem('timeRecorderPat',sessionPat)}catch{}}delete stored.GITHUB_PAT;try{localStorage.setItem('timeRecorderConfig',JSON.stringify(stored))}catch{}}return {...stored,GITHUB_PAT:sessionPat||''}};
    const current=()=>sessions.find(s=>s.id===currentId)||null;

    function persist(){try{localStorage.setItem(STORE.sessions,JSON.stringify(sessions));if(currentId)localStorage.setItem(STORE.current,currentId)}catch{showToast('本地存储空间不足')}}
    function newSession(title='新对话'){const s={id:`sess_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,title,conversationId:null,messages:[],updatedAt:Date.now()};sessions.unshift(s);currentId=s.id;persist();return s}
    function createNewChat(){if(generating)stopGeneration();const s=newSession();loadSession(s.id);toggleSidebar(false);setTimeout(()=>dom.input.focus(),50)}
    function loadSession(id){if(generating)return;const s=sessions.find(x=>x.id===id);if(!s)return;currentId=id;persist();renderMessages();renderSidebar();toggleSidebar(false)}
    function deleteSession(id,event){event.stopPropagation();if(generating||!confirm('删除这条对话？此操作无法撤销。'))return;sessions=sessions.filter(s=>s.id!==id);if(!sessions.length)newSession();currentId=sessions.some(s=>s.id===currentId)?currentId:sessions[0].id;persist();renderMessages();renderSidebar()}
    function clearCurrentChat(){const s=current();if(!s||generating||!s.messages.length||!confirm('清空当前对话？此操作无法撤销。'))return;s.messages=[];s.conversationId=null;s.title='新对话';s.updatedAt=Date.now();persist();renderMessages();renderSidebar()}
    function groupName(time){const days=(Date.now()-Number(time||0))/86400000;if(days<1&&new Date(time).getDate()===new Date().getDate())return'今天';return days<7?'过去 7 天':'更早'}
    function renderSidebar(){dom.sessionList.innerHTML='';let previous='';[...sessions].sort((a,b)=>b.updatedAt-a.updatedAt).forEach(s=>{const group=groupName(s.updatedAt);if(group!==previous){const label=document.createElement('div');label.className='group-label';label.textContent=group;dom.sessionList.append(label);previous=group}const item=document.createElement('button');item.className=`session${s.id===currentId?' active':''}`;item.onclick=()=>loadSession(s.id);const title=document.createElement('span');title.className='session-title';title.textContent=s.title||'新对话';const remove=document.createElement('button');remove.className='session-delete';remove.title='删除对话';remove.innerHTML='<i class="fa fa-trash-o"></i>';remove.onclick=e=>deleteSession(s.id,e);item.append(title,remove);dom.sessionList.append(item)})}
    function renderMessages(){const s=current();dom.messages.innerHTML='';const has=Boolean(s&&s.messages.length);dom.welcome.hidden=has;dom.messages.hidden=!has;if(s){dom.title.innerHTML=`${escapeHtml(s.title||'新对话')}<span class="model">清言智能体</span>`;s.messages.forEach((m,i)=>renderMessage(m,{index:i,actions:m.role==='assistant'}))}requestAnimationFrame(scrollBottom)}
    function renderMessage(message,options={}){const row=document.createElement('article');row.className=`message ${message.role}`;if(message.role==='assistant'){const avatar=document.createElement('div');avatar.className='avatar';avatar.innerHTML='<i class="fa fa-plus"></i>';row.append(avatar)}const col=document.createElement('div');col.className='message-col';if(message.role==='assistant'){const name=document.createElement('div');name.className='assistant-name';name.textContent='AI 健康顾问';col.append(name)}if(message.fileName){const file=document.createElement('div');file.className='file-label';file.innerHTML=`<i class="fa fa-file-o"></i><span>${escapeHtml(message.fileName)}</span>`;col.append(file)}const body=document.createElement('div');body.className='message-body';setContent(body,message.content||'',message.images||[],message.role);if(message.error)body.classList.add('error');col.append(body);if(options.actions&&message.content){const actions=document.createElement('div');actions.className='msg-actions';actions.innerHTML='<button class="mini" title="复制"><i class="fa fa-clone"></i></button><button class="mini" title="重新回答"><i class="fa fa-refresh"></i></button>';actions.children[0].onclick=()=>copyText(message.content);actions.children[1].onclick=()=>regenerate(options.index);col.append(actions)}row.append(col);dom.messages.append(row);return{row,col,body}}
    function setContent(node,text,images,role='assistant'){node.classList.toggle('markdown',role==='assistant');node.innerHTML=role==='assistant'?markdown(text):escapeHtml(text);(images||[]).forEach(url=>{if(!/^https:\/\//i.test(url))return;const img=document.createElement('img');img.className='output-image';img.src=url;img.alt='AI 生成的图片';img.loading='lazy';node.append(img)})}
    function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function inline(value){return value.replace(/\`([^\`]+)\`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)&amp;"'<>]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
    function markdown(value=''){const blocks=[];let text=String(value).replace(/\`\`\`(?:\w+)?\n?([\s\S]*?)\`\`\`/g,(_,code)=>{const key=`\u0000CODE${blocks.length}\u0000`;blocks.push(`<pre><code>${escapeHtml(code.trim())}</code></pre>`);return key});const lines=escapeHtml(text).split(/\r?\n/);let html='',list='';const close=()=>{if(list){html+=`</${list}>`;list=''}};lines.forEach(line=>{const code=line.match(/^\u0000CODE(\d+)\u0000$/);if(code){close();html+=blocks[Number(code[1])];return}const heading=line.match(/^(#{1,3})\s+(.+)$/);if(heading){close();const n=heading[1].length;html+=`<h${n}>${inline(heading[2])}</h${n}>`;return}const bullet=line.match(/^\s*[-*]\s+(.+)$/),number=line.match(/^\s*\d+\.\s+(.+)$/);if(bullet||number){const wanted=bullet?'ul':'ol';if(list!==wanted){close();html+=`<${wanted}>`;list=wanted}html+=`<li>${inline((bullet||number)[1])}</li>`;return}close();if(/^&gt;\s?/.test(line))html+=`<blockquote>${inline(line.replace(/^&gt;\s?/,''))}</blockquote>`;else if(line.trim())html+=`<p>${inline(line)}</p>`;else html+='<div style="height:5px"></div>'});close();return html}
    function toggleSidebar(show){dom.sidebar.classList.toggle('open',show);dom.overlay.classList.toggle('show',show)}
    function scrollBottom(){dom.scroll.scrollTop=dom.scroll.scrollHeight}
    function showToast(text){clearTimeout(toastTimer);dom.toast.textContent=text;dom.toast.classList.add('show');toastTimer=setTimeout(()=>dom.toast.classList.remove('show'),1800)}
    async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove()}showToast('已复制')}
    function autoResize(){dom.input.style.height='38px';dom.input.style.height=`${Math.min(dom.input.scrollHeight,160)}px`}
    function refreshSend(){dom.send.disabled=generating?false:!dom.input.value.trim()&&!selectedFile}
    function setGenerating(active){generating=active;dom.input.disabled=active;dom.file.disabled=active;dom.send.title=active?'停止生成':'发送';dom.send.innerHTML=active?'<i class="fa fa-stop"></i>':'<i class="fa fa-arrow-up"></i>';refreshSend()}
    function clearAttachment(){selectedFile=null;dom.file.value='';dom.preview.classList.remove('show');dom.fileName.textContent='';refreshSend()}

    async function getToken(){const cfg=config(),now=Date.now();if(cachedToken&&tokenExpiry>now+60000)return cachedToken;if(!cfg.apiKey||!cfg.apiSecret)throw new Error('请先配置 API Key 和 API Secret');const response=await fetch(`${API_ROOT}/get_token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:cfg.apiKey,api_secret:cfg.apiSecret})});const data=await response.json().catch(()=>({}));if(!response.ok||data.status!==0||!data.result?.access_token)throw new Error(data.message||`鉴权失败（HTTP ${response.status}）`);cachedToken=data.result.access_token;tokenExpiry=now+Number(data.result.expires_in||7200)*1000;return cachedToken}
    async function upload(file,token,signal){const form=new FormData();form.append('file',file);const response=await fetch(`${API_ROOT}/file_upload`,{method:'POST',headers:{Authorization:`Bearer ${token}`},body:form,signal});const data=await response.json().catch(()=>({}));if(!response.ok||data.status!==0||!data.result?.file_id)throw new Error(data.message||`附件上传失败（HTTP ${response.status}）`);return data.result.file_id}
    async function stream(prompt,session,fileIds,onUpdate,signal){const token=await getToken(),cfg=config();if(!cfg.assistantId)throw new Error('请先配置 Assistant ID');const body={assistant_id:cfg.assistantId,prompt};if(session.conversationId)body.conversation_id=session.conversationId;if(fileIds.length)body.file_list=fileIds.map(file_id=>({file_id}));const response=await fetch(`${API_ROOT}/stream`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body),signal});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.message||`请求失败（HTTP ${response.status}）`)}if(!response.body)throw new Error('浏览器不支持流式响应');
      const reader=response.body.getReader(),decoder=new TextDecoder(),texts=new Map(),extras=new Map(),images=new Set();let buffer='',historyId='',streamError='',toolState='';
      const emit=()=>onUpdate({text:[...texts.values(),...extras.values()].filter(Boolean).join('\n\n'),images:[...images],toolState});
      const handle=raw=>{if(!raw||raw==='[DONE]')return;let data;try{data=JSON.parse(raw)}catch{return}if(data.conversation_id){session.conversationId=data.conversation_id;persist()}if(data.history_id)historyId=data.history_id;if(data.status==='error')streamError=data.last_error?.error_msg||'生成失败';const message=data.message||{},content=message.content||{},key=`${message.role||'assistant'}|${message.created_at||'current'}|${content.type||'unknown'}`;if(message.status==='error')streamError=data.last_error?.error_msg||content.content||'生成失败';if(content.type==='text'&&typeof content.text==='string'){texts.set(key,content.text);toolState='';emit()}else if(content.type==='image'&&Array.isArray(content.image)){content.image.forEach(i=>{if(i?.image_url)images.add(i.image_url)});toolState='';emit()}else if(content.type==='execution_output'&&content.content){extras.set(key,`执行结果：\n\n\`\`\`\n${content.content}\n\`\`\``);toolState='';emit()}else if(content.type==='system_error')streamError=content.content||'工具执行失败';else if(content.type==='tool_calls'){toolState=content.tool_calls?.name==='browser'?'正在检索相关资料':'正在调用工具';emit()}};
      const consume=final=>{const lines=buffer.split(/\r?\n/);if(!final)buffer=lines.pop()||'';else buffer='';lines.forEach(line=>{if(line.startsWith('data:'))handle(line.slice(5).trim())})};
      while(true){const{done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});consume(false)}buffer+=decoder.decode();consume(true);if(streamError)throw new Error(streamError);return{text:[...texts.values(),...extras.values()].filter(Boolean).join('\n\n'),images:[...images],historyId}
    }
    async function generateReply(prompt,session,fileIds=[]){controller=new AbortController();setGenerating(true);dom.welcome.hidden=true;dom.messages.hidden=false;const live=renderMessage({role:'assistant',content:''});live.body.classList.add('typing');scrollBottom();let latest={text:'',images:[]};try{const result=await stream(prompt,session,fileIds,update=>{latest=update;setContent(live.body,update.text||'',update.images||[],'assistant');live.body.classList.add('typing');if(update.toolState){const state=document.createElement('div');state.className='tool';state.innerHTML=`<i class="fa fa-circle-o-notch"></i><span>${escapeHtml(update.toolState)}</span>`;live.body.prepend(state)}scrollBottom()},controller.signal);session.messages.push({role:'assistant',content:result.text||(result.images.length?'':'暂时没有生成可显示的内容。'),images:result.images,historyId:result.historyId||''})}catch(error){if(error.name==='AbortError')session.messages.push({role:'assistant',content:latest.text||'已停止生成。',images:latest.images||[]});else session.messages.push({role:'assistant',content:`请求未完成：${error.message}`,error:true})}finally{session.updatedAt=Date.now();persist();setGenerating(false);controller=null;renderMessages();renderSidebar()}}
    async function sendMessage(){if(generating){stopGeneration();return}const text=dom.input.value.trim(),file=selectedFile;if(!text&&!file)return;const session=current()||newSession();const heading=text||file.name;if(!session.messages.length)session.title=heading.slice(0,24)+(heading.length>24?'…':'');session.messages.push({role:'user',content:text||'请分析这个附件。',fileName:file?.name||''});session.updatedAt=Date.now();persist();dom.input.value='';autoResize();clearAttachment();renderMessages();renderSidebar();let fileIds=[];if(file){try{setGenerating(true);controller=new AbortController();fileIds=[await upload(file,await getToken(),controller.signal)]}catch(error){session.messages.push({role:'assistant',content:error.name==='AbortError'?'已停止上传。':`附件未能上传：${error.message}`,error:true});session.updatedAt=Date.now();persist();setGenerating(false);controller=null;renderMessages();return}}await generateReply(text||'请分析这个附件。',session,fileIds)}
    function stopGeneration(){controller?.abort()}
    async function regenerate(index){if(generating)return;const session=current();if(!session||session.messages[index]?.role!=='assistant')return;const prior=session.messages.slice(0,index),lastUser=[...prior].reverse().find(m=>m.role==='user');if(!lastUser)return;session.messages=prior;session.conversationId=null;persist();renderMessages();const context=prior.slice(-12).map(m=>`${m.role==='user'?'用户':'助手'}：${m.content}`).join('\n\n');await generateReply(`请根据以下对话重新回答最后一个用户问题。不要提及你正在重新回答。\n\n${context}`,session)}
    function usePrompt(prompt){dom.input.value=prompt;autoResize();refreshSend();sendMessage()}

    async function fetchGist(cfg,signal){const response=await fetch(`https://api.github.com/gists/${encodeURIComponent(cfg.GIST_ID)}`,{headers:{Authorization:`token ${cfg.GITHUB_PAT}`,Accept:'application/vnd.github.v3+json'},cache:'no-store',signal});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||`同步失败（HTTP ${response.status}）`);const file=data.files?.['records.json'];return file?.content?json(file.content,[]):[]}
    function matchRecords(local,gist){const events=[];const add=(records,type)=>(Array.isArray(records)?records:[]).forEach(r=>{const timestamp=new Date(String(r.time||'').replace(/\//g,'-')).getTime();if(!Number.isNaN(timestamp))events.push({type,timestamp,time:r.time,remark:r.remark||'',used:false})});add(local,'local');add(gist,'gist');events.sort((a,b)=>a.timestamp-b.timestamp);const pairs=[];for(let i=0;i<events.length;i++){if(events[i].used)continue;for(let j=i+1;j<events.length;j++){const duration=events[j].timestamp-events[i].timestamp;if(duration>43200000)break;if(!events[j].used&&events[j].type!==events[i].type&&duration>=60000){events[i].used=events[j].used=true;pairs.push({start:events[i],end:events[j],minutes:Math.round(duration/60000),crossDay:new Date(events[i].timestamp).toDateString()!==new Date(events[j].timestamp).toDateString()});break}}}return pairs.sort((a,b)=>b.start.timestamp-a.start.timestamp)}
    function analysisPrompt(pairs){const recent=pairs.slice(0,10),values=recent.map(x=>x.minutes),avg=Math.round(values.reduce((a,b)=>a+b,0)/values.length),details=recent.map((x,i)=>`${i+1}. ${x.start.time} 至 ${x.end.time}，${x.minutes} 分钟${x.crossDay?'，跨日':''}${x.start.remark||x.end.remark?`，备注：${x.start.remark||x.end.remark}`:''}`).join('\n');return`请你以喵宝的身份。请基于下列个人时间记录给出简洁、具体、非诊断性的建议。避免羞辱或夸大风险；若存在明确风险信号，说明何时应咨询医生。\n\n最近 ${recent.length} 次记录平均 ${avg} 分钟，最长 ${Math.max(...values)} 分钟，最短 ${Math.min(...values)} 分钟。\n\n${details}\n\n请按以下结构回答：\n1. 数据观察\n2. 时长与时段评估\n3. 三条可执行建议\n4. 需要留意的风险信号`}
    async function startHealthAnalysis(){
      if(generating)return;toggleSidebar(false);
      const session=newSession(`健康记录分析 ${new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})}`);
      session.messages.push({role:'user',content:'请你以喵宝的身份，分析我最近的时间记录，并给出具体建议。'});persist();renderMessages();renderSidebar();
      controller=new AbortController();setGenerating(true);
      try{
        const cfg=timeRecorderConfig();
        if(!cfg.GIST_ID||!cfg.GITHUB_PAT)throw new Error('云端配置不完整，请返回时间笔记的云端同步页补充 Gist ID 和当前会话令牌');
        const pairs=matchRecords(json(localStorage.getItem('timeRecords'),[]),await fetchGist(cfg,controller.signal));
        if(!pairs.length)throw new Error('没有找到 1 分钟至 12 小时范围内的有效闭环记录');
        setGenerating(false);controller=null;await generateReply(analysisPrompt(pairs),session);
      }catch(error){
        if(error.name!=='AbortError')session.messages.push({role:'assistant',content:`暂时无法分析记录：${error.message}。`,error:true});
        else session.messages.push({role:'assistant',content:'已停止同步记录。'});
        session.updatedAt=Date.now();persist();renderMessages();renderSidebar();
      }finally{if(controller){controller=null;setGenerating(false)}}
    }

    function openSettings(){const cfg=config();$('cfgKey').value=cfg.apiKey;$('cfgSecret').value=cfg.apiSecret;$('cfgAssistant').value=cfg.assistantId;dom.settings.classList.add('show')}
    function closeSettings(){dom.settings.classList.remove('show')}
    function saveSettings(){const key=$('cfgKey').value.trim(),secret=$('cfgSecret').value.trim(),assistant=$('cfgAssistant').value.trim();if(!key||!secret||!assistant){showToast('请完整填写三项 API 配置');return}localStorage.setItem('glm_api_key',key);localStorage.setItem('glm_api_secret',secret);localStorage.setItem('glm_assistant_id',assistant);cachedToken='';tokenExpiry=0;updateApiStatus();closeSettings();showToast('API 配置已保存')}
    function updateApiStatus(){const cfg=config();dom.apiStatus.classList.toggle('ready',Boolean(cfg.apiKey&&cfg.apiSecret&&cfg.assistantId))}
    dom.overlay.onclick=()=>toggleSidebar(false);dom.settings.onclick=e=>{if(e.target===dom.settings)closeSettings()};dom.input.oninput=()=>{autoResize();refreshSend()};dom.input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}};dom.send.onclick=sendMessage;dom.file.onchange=()=>{const file=dom.file.files?.[0];if(!file)return;if(file.size>100*1024*1024){showToast('附件不能超过 100MB');dom.file.value='';return}selectedFile=file;dom.fileName.textContent=file.name;dom.preview.classList.add('show');refreshSend()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSettings();toggleSidebar(false)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();createNewChat()}});
    if(!sessions.length)newSession();if(!sessions.some(s=>s.id===currentId))currentId=sessions[0].id;persist();renderSidebar();renderMessages();updateApiStatus();refreshSend();
  </script>
