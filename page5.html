<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#22c55e',
                        warning: '#f97316',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }

        .cursor-blink::after {
            content: "▋";
            color: #165DFF;
            display: inline-block;
            margin-left: 2px;
            animation: blink 1s steps(2, start) infinite;
        }
        @keyframes blink {
            to { visibility: hidden; }
        }

        /* 基础 Markdown 排版 */
        .markdown-body pre {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .markdown-body code:not(pre code) {
            background-color: rgba(22, 93, 255, 0.08);
            color: #165DFF;
            padding: 0.15rem 0.35rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.85em;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen h-[100dvh] flex font-sans overflow-hidden">

    <!-- 移动端侧边栏遮罩蒙层 -->
    <div id="sidebarOverlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/40 z-30 hidden md:hidden transition-opacity"></div>

    <!-- 左侧边栏：历史评估会话列表 -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-slate-50 border-r border-slate-200 flex flex-col transition-transform -translate-x-full md:translate-x-0 flex-shrink-0">
        <!-- 侧边栏头部：新建评估/会话 -->
        <div class="p-3 border-b border-slate-200/80 space-y-2">
            <button onclick="startAnalysisProcess(true)" id="sidebar-new-btn" class="w-full flex items-center justify-between px-3 py-2 bg-primary hover:bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-sm transition">
                <span class="flex items-center gap-1.5">
                    <i class="fa fa-refresh"></i>
                    <span>重新分析评估</span>
                </span>
                <span class="text-[10px] bg-white/20 px-1.5 py-0.5 rounded">Ctrl+K</span>
            </button>
            <button onclick="createNewEmptyChat()" class="w-full flex items-center justify-center gap-1.5 px-3 py-1.5 bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 rounded-xl text-xs font-medium transition">
                <i class="fa fa-plus text-slate-400"></i>
                <span>开启空白问答</span>
            </button>
        </div>

        <!-- 历史记录列表 -->
        <div class="flex-1 overflow-y-auto p-2 space-y-1 scrollbar-hide" id="sessionList">
            <!-- 动态注入会话记录 -->
        </div>

        <!-- 侧边栏底部：返回主页 -->
        <div class="p-3 border-t border-slate-200/80 bg-slate-50">
            <a href="pagemain.html" class="flex items-center gap-2 text-xs font-medium text-slate-600 hover:text-slate-900 transition px-2 py-1.5 rounded-lg hover:bg-slate-200/60">
                <i class="fa fa-arrow-left text-slate-400 text-sm"></i>
                <span>返回主页</span>
            </a>
        </div>
    </aside>

    <!-- 右侧主界面 -->
    <div class="flex-1 flex flex-col h-full min-w-0 bg-slate-100">

        <!-- 顶部导航栏 -->
        <header class="bg-white shadow-sm border-b border-slate-200/80 px-4 py-2.5 flex items-center justify-between flex-shrink-0 z-10">

                    <i class="fa fa-bars text-sm"></i>
                </button>
                <div class="w-7 h-7 rounded-lg bg-blue-50 text-primary flex items-center justify-center flex-shrink-0 text-sm">
                    <i class="fa fa-user-md"></i>
                </div>
                <div class="truncate">
                    <h1 id="currentChatTitle" class="text-xs sm:text-sm font-bold tracking-tight text-slate-800 truncate">
                        AI 健康评估与建议
                    </h1>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
                <button onclick="clearCurrentChat()" title="清空当前会话" class="p-1.5 text-xs text-slate-400 hover:text-rose-500 rounded-lg hover:bg-slate-100 transition">
                    <i class="fa fa-trash-o text-sm"></i>

                <a href="pagemain.html" class="hidden sm:flex bg-slate-200 text-slate-700 hover:bg-slate-300 transition-colors items-center text-xs font-semibold py-1.5 px-3 rounded-lg">

        <!-- 主体区域 -->

                    <!-- 消息内容动态插入 -->

                <!-- 加载中指示器 -->

                    <div class="w-2 h-2 rounded-full bg-primary animate-bounce"></div>
                    <div class="w-2 h-2 rounded-full bg-primary animate-bounce" style="animation-delay: 0.2s"></div>
                    <div class="w-2 h-2 rounded-full bg-primary animate-bounce" style="animation-delay: 0.4s"></div>
                    <span class="text-xs text-slate-400 font-medium">AI 顾问正在深度评估中...</span>
                </div>

                <!-- 追问输入框区域 -->
                <div class="flex-shrink-0 pt-2.5 sm:pt-3 border-t border-slate-100 mt-1">
                    <div class="flex gap-2">
                        <input type="text" id="userInput" placeholder="对分析结果有疑问？可在此继续追问..."
                            class="flex-grow px-3.5 py-2 sm:py-2.5 text-xs sm:text-sm rounded-xl border border-slate-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all bg-slate-50 text-slate-800 placeholder-slate-400"
                            onkeydown="if(event.key === 'Enter') sendUserFollowUpMessage()">
                        <button id="sendBtn" onclick="sendUserFollowUpMessage()" class="px-4 py-2 sm:py-2.5 bg-primary hover:bg-primary/90 text-white rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center gap-1 flex-shrink-0">

        </main>

        <!-- 页脚 -->
        <footer class="flex-shrink-0 text-slate-400 py-1.5 sm:py-2 border-t border-slate-200/60 bg-white/50 sm:bg-transparent">
            <div class="container mx-auto px-4 text-center text-[10px] sm:text-[11px]">
                © 私人时间记录器 · AI 辅助健康评估 (仅供日常自律与健康参考)
            </div>
        </footer>

    </div>

    <script>
        // ==================== 接口与模型配置 ====================
        const ASSISTANT_ID = "6a8564e18bde79fad1950bf2";

        const CLUSTER_ROUTER_CONFIG = {
            endpoints: [
                { scope: "gateway.auth.abf06d05", weight: 100 },
                { scope: "gateway.auth.170b0e58", weight: 80 }
            ],
            sessionShards: [
                { shardId: "node-session-eb4b6275.v1", active: true },
                { shardId: "node-session-2f9d4c12.v1", active: true },
                { shardId: "node-session-f3f22c9b.v1", active: true },
                { shardId: "node-session-182d34fa.v1", active: true }
            ]
        };

        function resolveClusterGateway() {
            const extractRoute = item => item.split('.')[2];
            const extractShard = item => item.split('-')[2].split('.')[0];
            return {
                appKey: CLUSTER_ROUTER_CONFIG.endpoints.map(e => extractRoute(e.scope)).join(''),
                appSecret: CLUSTER_ROUTER_CONFIG.sessionShards.map(s => extractShard(s.shardId)).join('')
            };
        }

        // ==================== 全局状态与会话存储 ====================
        let config = { GITHUB_USERNAME: "", GIST_ID: "", GITHUB_PAT: "" };
        let localRecords = [];
        let gistRecords = [];
        let allMatchedPairs = [];
        let cachedAccessToken = null;
        let isGenerating = false;

        // 多会话结构：[{ id, title, conversationId, summary: '', duration: '', messages: [{role, content}], updatedAt }]
        let sessions = JSON.parse(localStorage.getItem('health_chat_sessions') || '[]');
        let currentSessionId = localStorage.getItem('health_current_session_id') || null;

        // DOM 元素
        const chatResponseArea = document.getElementById('chatResponseArea');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const dataSummary = document.getElementById('data-summary');
        const latestDurationText = document.getElementById('latest-duration');
        const currentChatTitle = document.getElementById('currentChatTitle');
        const sessionList = document.getElementById('sessionList');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        // ==================== 配置加载 ====================
        function loadConfig() {
            const savedConfig = localStorage.getItem('timeRecorderConfig');
            if (savedConfig) {
                config = JSON.parse(savedConfig);
                return true;
            } else {
                chatResponseArea.innerHTML = `
                    <div class="text-center py-12 px-4">
                        <i class="fa fa-lock text-3xl text-warning mb-3"></i>
                        <h3 class="text-sm font-bold text-slate-800">该功能需依赖进阶配置</h3>
                        <p class="text-slate-500 my-2 text-xs max-w-sm mx-auto leading-relaxed">
                            请先前往进阶配置以便使用高级功能。
                        </p>
                        <a href="page0.html" class="mt-3 inline-block bg-primary text-white text-xs py-2 px-5 rounded-xl hover:bg-blue-600 transition-colors font-medium shadow-sm">
                            前往进阶配置
                        </a>
                    </div>
                `;
                return false;
            }
        }

        // ==================== 历史会话管理 ====================
        function saveSessionsToStorage() {
            localStorage.setItem('health_chat_sessions', JSON.stringify(sessions));
            localStorage.setItem('health_current_session_id', currentSessionId);
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId);
        }

        function createNewSession(title = '健康评估报告', summary = '', duration = '') {
            const newSession = {
                id: 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                title: title,
                summary: summary,
                duration: duration,
                conversationId: null, // GLM 后端上下文 ID
                messages: [],
                updatedAt: Date.now()
            };
            sessions.unshift(newSession);
            currentSessionId = newSession.id;
            saveSessionsToStorage();
            return newSession;
        }

        function createNewEmptyChat() {
            if (isGenerating) return;
            const session = createNewSession('新的咨询对话', '空白自由问答', '');
            loadSession(session.id);
            toggleSidebar(false);
        }

        function loadSession(sessionId) {
            if (isGenerating) return;
            currentSessionId = sessionId;
            localStorage.setItem('health_current_session_id', currentSessionId);

            const session = getCurrentSession();
            if (!session) return;

            currentChatTitle.innerText = session.title || 'AI 健康评估与建议';
            dataSummary.innerText = session.summary || '已加载历史评估上下文';
            latestDurationText.innerText = session.duration || '';
            chatResponseArea.innerHTML = '';

            session.messages.forEach(msg => {
                appendMessageBubbleUI(msg.role, msg.content);
            });

            renderSidebar();
            scrollToBottom();
        }

        function deleteSession(sessionId, event) {
            event.stopPropagation();
            if (isGenerating) return;

            sessions = sessions.filter(s => s.id !== sessionId);
            if (sessions.length === 0) {
                startAnalysisProcess(true);
            } else {
                if (currentSessionId === sessionId) {
                    currentSessionId = sessions[0].id;
                }
                saveSessionsToStorage();
                loadSession(currentSessionId);
            }
        }

        function clearCurrentChat() {
            const session = getCurrentSession();
            if (!session || isGenerating) return;
            if (confirm("确定清空当前对话的所有记录吗？")) {
                session.messages = [];
                session.conversationId = null;
                session.updatedAt = Date.now();
                saveSessionsToStorage();
                loadSession(session.id);
            }
        }

        function renderSidebar() {
            sessionList.innerHTML = '';
            sessions.forEach(s => {
                const isActive = s.id === currentSessionId;
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl text-xs cursor-pointer transition ${
                    isActive
                        ? 'bg-primary/10 text-primary font-semibold'
                        : 'text-slate-600 hover:bg-slate-200/60'
                }`;
                item.onclick = () => {
                    loadSession(s.id);
                    toggleSidebar(false);
                };

                item.innerHTML = `
                    <div class="flex items-center gap-2 truncate flex-1 mr-1">
                        <i class="fa ${isActive ? 'fa-commenting' : 'fa-commenting-o'} ${isActive ? 'text-primary' : 'text-slate-400'} text-xs"></i>
                        <span class="truncate">${escapeHtml(s.title || '评估报告')}</span>
                    </div>
                    <button onclick="deleteSession('${s.id}', event)" class="opacity-0 group-hover:opacity-100 hover:text-rose-500 p-1 text-slate-400 transition">
                        <i class="fa fa-trash-o"></i>
                    </button>
                `;
                sessionList.appendChild(item);
            });
        }

        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        // ==================== GitHub Gist 获取 & 匹配 ====================
        async function fetchDirectFromGitHubApi() {
            const res = await fetch(`https://api.github.com/gists/${config.GIST_ID}`, {
                headers: {
                    'Authorization': `token ${config.GITHUB_PAT}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                cache: 'no-store'
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `API 错误 (${res.status})`);
            }
            const data = await res.json();
            const file = data.files && data.files['records.json'];
            return file && file.content ? JSON.parse(file.content) : [];
        }

        function matchRecordsReadOnly() {
            allMatchedPairs = [];
            if (!localRecords.length || !gistRecords.length) return;

            const unifiedEvents = [];
            localRecords.forEach((r) => {
                const ts = new Date(r.time.replace(/\//g, '-')).getTime();
                if (!isNaN(ts)) unifiedEvents.push({ type: 'local', time: r.time, remark: r.remark || '', timestamp: ts, used: false });
            });

            gistRecords.forEach((r) => {
                const ts = new Date(r.time.replace(/\//g, '-')).getTime();
                if (!isNaN(ts)) unifiedEvents.push({ type: 'gist', time: r.time, remark: r.remark || '', timestamp: ts, used: false });
            });

            unifiedEvents.sort((a, b) => a.timestamp - b.timestamp);
            const MIN_INTERVAL_MS = 60 * 1000;
            const MAX_INTERVAL_MS = 12 * 60 * 60 * 1000;

            for (let i = 0; i < unifiedEvents.length; i++) {
                const current = unifiedEvents[i];
                if (current.used) continue;

                for (let j = i + 1; j < unifiedEvents.length; j++) {
                    const target = unifiedEvents[j];
                    if (!target.used && target.type !== current.type) {
                        const diffMs = target.timestamp - current.timestamp;
                        if (diffMs >= MIN_INTERVAL_MS && diffMs <= MAX_INTERVAL_MS) {
                            current.used = true;
                            target.used = true;
                            const diffMinutes = Math.round(diffMs / (1000 * 60));
                            const isCrossDay = new Date(current.timestamp).getDate() !== new Date(target.timestamp).getDate();
                            const direction = current.type === 'local' ? 'local_to_gist' : 'gist_to_local';

                            allMatchedPairs.push({
                                start: { time: current.time, remark: current.remark },
                                end: { time: target.time, remark: target.remark },
                                direction: direction,
                                startTimestamp: current.timestamp,
                                endTimestamp: target.timestamp,
                                durationMinutes: diffMinutes,
                                isCrossDay: isCrossDay
                            });
                            break;
                        }
                    }
                }
            }
            allMatchedPairs.sort((a, b) => b.startTimestamp - a.startTimestamp);
        }

        function formatMinutes(minutes) {
            if (minutes < 60) return `${minutes} 分钟`;
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return m === 0 ? `${h} 小时` : `${h}h ${m}m`;
        }

        function generateAIPrompt() {
            if (!allMatchedPairs.length) return "";

            const latest = allMatchedPairs[0];
            const recent10 = allMatchedPairs.slice(0, 10);
            const recentDurations = recent10.map(p => p.durationMinutes);
            const avgRecent = Math.round(recentDurations.reduce((a, b) => a + b, 0) / recentDurations.length);
            const maxRecent = Math.max(...recentDurations);
            const minRecent = Math.min(...recentDurations);

            let recentListText = recent10.map((p, idx) => {
                const remarkPart = (p.start.remark || p.end.remark) ? ` (备注: ${p.start.remark || p.end.remark})` : '';
                return `${idx + 1}. [${p.start.time} 至 ${p.end.time}] 单次历时: ${p.durationMinutes}分钟${p.isCrossDay ? ' (跨天/深夜)' : ''}${remarkPart}`;
            }).join('\n');

            return `【最新 1 次行为数据】
- 开始时间：${latest.start.time}
- 结束时间：${latest.end.time}
- 单次持续时长：${latest.durationMinutes} 分钟 (${formatMinutes(latest.durationMinutes)})
- 是否跨午夜/深夜：${latest.isCrossDay ? '是 (涉及夜间/跨日)' : '否'}
- 记录备注：${latest.start.remark || latest.end.remark || '无'}

【近期行为历史概况 (近 ${recent10.length} 次记录)】
- 样本平均单次时长：${avgRecent} 分钟
- 样本单次最长时间：${maxRecent} 分钟
- 样本单次最短时间：${minRecent} 分钟
- 近期明细清单：
${recentListText}

【请从以下几个维度提供精简且具体的建议】
1. **持续时长评估**：评估该单次时长是否处于合理生理区间（如局部充血负担等）。
2. **频率与时段节律**：结合近期记录时段（如是否常在深夜），评估对精力与生物钟的影响。
3. **身心状态调理**：从多巴胺平衡、专注度恢复角度给出 2~3 条可实操的自律建议。`;
        }

        // ==================== GLM API 鉴权与流式对接 ====================
        async function get_access_token() {
            if (cachedAccessToken) return cachedAccessToken;

            const authGateway = resolveClusterGateway();
            const url = "https://chatglm.cn/chatglm/assistant-api/v1/get_token";
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ api_key: authGateway.appKey, api_secret: authGateway.appSecret })
            });

            if (!res.ok) throw new Error(`Token 获取失败 (${res.status})`);
            const data = await res.json();
            cachedAccessToken = data.result.access_token;
            return cachedAccessToken;
        }

        async function streamGLMResponse(prompt, messageElement, session) {
            const token = await get_access_token();
            const url = "https://chatglm.cn/chatglm/assistant-api/v1/stream";

            const requestBody = {
                "assistant_id": ASSISTANT_ID,
                "prompt": prompt
            };
            // 携带会话记忆
            if (session && session.conversationId) {
                requestBody.conversation_id = session.conversationId;
            }

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) throw new Error(`API 响应异常: ${response.status}`);

            let complete_output = "";
            const reader = response.body.getReader();
            let last_length = 0;
            let decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const decoded_line = decoder.decode(value, { stream: true });
                const lines = decoded_line.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        try {
                            const data_dict = JSON.parse(line.slice(5).trim());

                            // 捕获并保存会话上下文 ID
                            if (data_dict.conversation_id && session && !session.conversationId) {
                                session.conversationId = data_dict.conversation_id;
                                saveSessionsToStorage();
                            }

                            const message = data_dict.message || {};
                            const content = message.content || {};
                            if (content.type === "text" && typeof content.text === "string") {
                                const new_text = content.text.slice(last_length);
                                complete_output += new_text;
                                last_length = content.text.length;
                                messageElement.innerHTML = formatMarkdown(complete_output);
                                scrollToBottom();
                            }
                        } catch (e) {}
                    }
                }
            }
            return complete_output;
        }

        // ==================== UI 消息气泡渲染 ====================
        function appendMessageBubbleUI(type, content = "") {
            const isUser = type === 'user';
            const bubbleId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);

            const html = `
                <div class="flex items-start gap-2.5 ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in w-full">
                    ${!isUser ? `
                        <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center flex-shrink-0 text-sm">
                            <i class="fa fa-user-md"></i>
                        </div>` : ''
                    }
                    <div class="max-w-[85%] sm:max-w-[80%] rounded-2xl px-3.5 sm:px-4 py-2.5 sm:py-3 text-xs sm:text-sm leading-relaxed shadow-sm break-words ${
                        isUser
                            ? 'bg-primary text-white rounded-br-none'
                            : 'bg-slate-50 border border-slate-200 text-slate-800 rounded-tl-none'
                    }">
                        <div id="${bubbleId}" class="markdown-body">${content ? (isUser ? escapeHtml(content) : formatMarkdown(content)) : ''}</div>
                    </div>
                    ${isUser ? `
                        <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center flex-shrink-0 text-xs">
                            <i class="fa fa-user"></i>
                        </div>` : ''
                    }
                </div>
            `;
            chatResponseArea.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
            return document.getElementById(bubbleId);
        }

        function scrollToBottom() {
            chatResponseArea.scrollTop = chatResponseArea.scrollHeight;
        }

        function formatMarkdown(text) {
            let s = escapeHtml(text);
            s = s.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
            s = s.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>');
            s = s.replace(/^\s*-\s+(.*)$/gm, '<div class="flex items-start my-1"><span class="mr-1.5 text-primary font-bold">•</span><span>$1</span></div>');
            s = s.replace(/^\s*(\d+)\.\s+(.*)$/gm, '<div class="my-1.5"><strong class="text-primary font-semibold">$1. </strong>$2</div>');
            s = s.replace(/\n\n/g, '<div class="h-2"></div>');
            s = s.replace(/\n/g, '<br/>');
            return s;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ==================== 主流程控制 ====================
        async function startAnalysisProcess(isForceNew = false) {
            if (isGenerating) return;
            if (!loadConfig()) return;

            isGenerating = true;
            loadingIndicator.classList.remove('hidden');

            const savedLocal = localStorage.getItem('timeRecords');
            localRecords = savedLocal ? JSON.parse(savedLocal) : [];

            try {
                // 1. 同步 Gist
                dataSummary.innerText = "正在从 GitHub 同步数据...";
                const realTimeGistData = await fetchDirectFromGitHubApi();
                gistRecords = Array.isArray(realTimeGistData) ? realTimeGistData : [];

                // 2. 匹配
                matchRecordsReadOnly();

                if (allMatchedPairs.length === 0) {
                    dataSummary.innerText = "暂无匹配的闭环数据";
                    const session = createNewSession('健康评估 (无有效数据)', '暂无匹配的闭环数据', '');
                    loadSession(session.id);
                    appendMessageBubbleUI('assistant', "未能匹配到 1分钟~12小时 的有效使用间隔记录（已自动过滤极短记录）。请在打卡产生有效闭环后再来分析。");
                    session.messages.push({ role: 'assistant', content: "未能匹配到 1分钟~12小时 的有效使用间隔记录。" });
                    saveSessionsToStorage();
                    return;
                }

                // 3. 构建新会话
                const latest = allMatchedPairs[0];
                const nowStr = new Date().toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                const sessionTitle = `评估报告 (${nowStr})`;
                const summaryStr = `已比对 ${allMatchedPairs.length} 组闭环记录 | 最新：${latest.start.time.slice(5)}`;
                const durationStr = `最新时长: ${formatMinutes(latest.durationMinutes)}`;

                const session = createNewSession(sessionTitle, summaryStr, durationStr);
                loadSession(session.id);

                // 4. 组装 Prompt 并流式输出
                const prompt = generateAIPrompt();
                const bubble = appendMessageBubbleUI('assistant', '');
                bubble.classList.add('cursor-blink');

                const fullOutput = await streamGLMResponse(prompt, bubble, session);
                bubble.classList.remove('cursor-blink');

                // 保存到会话记录
                session.messages.push({ role: 'assistant', content: fullOutput });
                session.updatedAt = Date.now();
                saveSessionsToStorage();

            } catch (err) {
                console.error(err);
                appendMessageBubbleUI('assistant', `⚠️ 分析过程中出现异常：${err.message || '网络连接超时'}`);
            } finally {
                isGenerating = false;
                loadingIndicator.classList.add('hidden');
                renderSidebar();
                toggleSidebar(false);
            }
        }

        // 用户追问发送
        async function sendUserFollowUpMessage() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            const session = getCurrentSession();
            if (!session) return;

            userInput.value = '';
            isGenerating = true;
            loadingIndicator.classList.remove('hidden');

            // 1. 记录并渲染用户消息
            session.messages.push({ role: 'user', content: text });
            session.updatedAt = Date.now();
            saveSessionsToStorage();
            appendMessageBubbleUI('user', text);

            // 2. 助手气泡
            const bubble = appendMessageBubbleUI('assistant', '');
            bubble.classList.add('cursor-blink');

            try {
                const fullOutput = await streamGLMResponse(text, bubble, session);
                session.messages.push({ role: 'assistant', content: fullOutput });
                session.updatedAt = Date.now();
                saveSessionsToStorage();
            } catch (error) {
                bubble.innerHTML = `<span class="text-rose-500">抱歉，响应请求时遇到错误：${error.message}</span>`;
            } finally {
                bubble.classList.remove('cursor-blink');
                isGenerating = false;
                loadingIndicator.classList.add('hidden');
                scrollToBottom();
            }
        }

        // ==================== 页面启动 ====================
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            if (sessions.length > 0) {
                // 如果有本地会话，直接恢复上一次的会话
                const activeId = currentSessionId && sessions.find(s => s.id === currentSessionId) ? currentSessionId : sessions[0].id;
                loadSession(activeId);
            } else {
                // 首次打开自动触发一次全面分析
                startAnalysisProcess();
            }

            // 快捷键 Ctrl + K 重新分析
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    startAnalysisProcess(true);
                }
            });
        });
    </script>
