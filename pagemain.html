<!DOCTYPE html>
<html lang="zh-CN" data-theme="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>时间笔记</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="stylesheet" href="assets/vendor/font-awesome.min.css">
    <script src="assets/vendor/chart.umd.min.js"></script>
    <link rel="stylesheet" href="assets/css/offline.css">
    <script src="assets/js/offline.js" defer></script>
    <link rel="stylesheet" href="assets/css/feedback.css">
    <style>
        /* CSS 变量管理三大主题 */
        :root[data-theme="blue"] {
            --bg-page: #F3F6FA;
            --bg-card: #FFFFFF;
            --bg-header: #111827;
            --header-text: #FFFFFF;
            --primary: #165DFF;
            --primary-hover: #0E42D2;
            --primary-light: #E8F3FF;
            --text-main: #111827;
            --text-sub: #86909C;
            --border-color: #E7EAF0;
            --table-header: #F7F8FA;
            --chart-border: #165DFF;
            --chart-bg: rgba(22, 93, 255, 0.15);
            --scrollbar-thumb: #D8DFE9;
        }

        :root[data-theme="white"] {
            --bg-page: #F8F9FA;
            --bg-card: #FFFFFF;
            --bg-header: #FFFFFF;
            --header-text: #18181B;
            --primary: #18181B;
            --primary-hover: #27272A;
            --primary-light: #F4F4F5;
            --text-main: #18181B;
            --text-sub: #71717A;
            --border-color: #E4E4E7;
            --table-header: #F4F4F5;
            --chart-border: #18181B;
            --chart-bg: rgba(24, 24, 27, 0.12);
            --scrollbar-thumb: #E4E4E7;
        }

        :root[data-theme="dark"] {
            --bg-page: #0B0F19;
            --bg-card: #151D2C;
            --bg-header: #151D2C;
            --header-text: #F1F5F9;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --primary-light: #1E293B;
            --text-main: #F1F5F9;
            --text-sub: #94A3B8;
            --border-color: #232F46;
            --table-header: #1A2336;
            --chart-border: #3B82F6;
            --chart-bg: rgba(59, 130, 246, 0.2);
            --scrollbar-thumb: #2B384E;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .card-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.04);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.3s ease;
        }

        .card-box:hover {
            border-color: color-mix(in srgb, var(--primary) 18%, var(--border-color));
        }

        .hero-card {
            background: linear-gradient(145deg, var(--bg-card), color-mix(in srgb, var(--primary-light) 58%, var(--bg-card)));
            position: relative;
            overflow: hidden;
        }

        .hero-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -90px;
            top: -90px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--primary) 9%, transparent);
            pointer-events: none;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .stat-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.8rem 0.9rem;
        }

        .stat-item strong {
            display: block;
            margin-top: 0.2rem;
            font-size: 1.15rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .eyebrow {
            color: var(--text-sub);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 999px;
            background: #22C55E;
            box-shadow: 0 0 0 3px color-mix(in srgb, #22C55E 14%, transparent);
        }

        .quick-link {
            border-radius: 0.75rem !important;
            box-shadow: none !important;
        }

        .app-stack {
            display: grid;
            gap: 1.25rem;
        }

        .app-stack > .hero-card,
        .app-stack > .stat-grid {
            grid-column: 1 / -1;
        }

        .record-panel,
        .stats-panel {
            min-width: 0;
        }

        .record-item {
            border-color: var(--border-color) !important;
            box-shadow: none !important;
        }

        .record-item:hover {
            background-color: var(--table-header) !important;
        }

        @media (min-width: 800px) {
            .app-stack { grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); }
        }

        .icon-btn:focus-visible,
        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--primary) 30%, transparent);
            outline-offset: 2px;
        }

        @media (max-width: 640px) {
            .stat-grid { gap: 0.5rem; }
            .stat-item { padding: 0.7rem; }
            .stat-item strong { font-size: 1rem; }
        }

        .btn-theme-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .btn-theme-primary:hover {
            background-color: var(--primary-hover);
        }

        .header-bg {
            background: var(--bg-header);
            color: var(--header-text);
        }

        /* 自定义精细滑动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar-thumb);
            border-radius: 9999px;
        }

        button, a {
            transition: transform 0.1s ease, background-color 0.2s ease, opacity 0.2s ease;
        }
        button:active, a:active {
            transform: scale(0.97);
        }

        .tab-btn {
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            background: var(--bg-card);
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }
        .hidden { display: none !important; }
        #toast { transition: opacity 0.3s, transform 0.3s; }
    </style>
    <link rel="stylesheet" href="assets/css/notebook.css">
    <script src="assets/js/notebook-theme.js"></script>
    <script src="assets/js/app-config.js"></script>
    <script src="assets/js/preferences.js"></script>
    <link rel="stylesheet" href="assets/css/mobile-ui.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <link rel="stylesheet" href="assets/css/tools-profile.css">
    <link rel="stylesheet" href="assets/css/record-calendar.css">
    <script src="assets/js/mobile-ui.js" defer></script>
    <script src="assets/js/record-calendar.js"></script>
    <script src="assets/js/record-entries.js"></script>
</head>
<body class="nb-page nb-home min-h-screen flex flex-col font-sans antialiased">

    <!-- ==== 全局模态框与Toast提示 ==== -->

    <!-- 通用编辑模态框 -->
    <div id="record-modal-overlay" data-mobile-dialog class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden" role="dialog" aria-modal="true" aria-labelledby="record-modal-title">
        <div data-mobile-panel class="card-box rounded-2xl shadow-2xl p-6 w-full max-w-md">
            <div class="flex items-start justify-between gap-4 mb-4">
                <div>
                    <p class="eyebrow mb-1">New entry</p>
                    <h2 id="record-modal-title" class="text-xl font-bold">记录此刻</h2>
                </div>
                <button type="button" id="cancel-record-btn" class="icon-btn w-8 h-8 rounded-lg flex items-center justify-center opacity-60 hover:opacity-100" aria-label="关闭记录弹窗" title="关闭">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form id="record-form" class="space-y-4">
                <input type="hidden" id="record-version">
                <div id="record-backfill-fields" class="record-date-fields" hidden>
                    <label>日期<input type="date" id="record-date"></label>
                    <label>时间<input type="time" step="1" id="record-clock-input"></label>
                </div>
                <div id="record-frozen-time" class="rounded-xl p-3" style="background-color: var(--table-header);">
                    <p class="text-xs opacity-60">记录时间</p>
                    <p id="record-time-preview" class="font-mono font-semibold mt-1"></p>
                </div>
                <div>
                    <div id="record-tags" class="record-tags"></div>
                    <label for="record-remark" class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">备注（可选）</label>
                    <textarea id="record-remark" rows="3" maxlength="240" placeholder="写下此刻在做什么（可选）" class="w-full px-3.5 py-2.5 rounded-xl border bg-transparent text-sm focus:outline-none" style="border-color: var(--border-color);"></textarea>
                </div>
                <div data-mobile-actions class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancel-record-btn-secondary" class="px-4 py-2.5 rounded-xl text-sm font-medium border" style="border-color: var(--border-color);">取消</button>
                    <button type="submit" id="save-record-btn" class="btn-theme-primary px-5 py-2.5 rounded-xl text-sm font-medium shadow-md"><i class="fa fa-check mr-1"></i>保存记录</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirm-modal-overlay" data-mobile-dialog class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <div data-mobile-panel class="card-box rounded-2xl shadow-2xl p-6 w-full max-w-sm">
            <div class="w-10 h-10 rounded-xl bg-red-500/10 text-red-500 flex items-center justify-center mb-4"><i class="fa fa-trash-o"></i></div>
            <h2 id="confirm-modal-title" class="text-lg font-bold mb-2">删除这条记录？</h2>
            <p id="confirm-modal-message" class="text-sm opacity-65 leading-relaxed">删除后无法恢复，请确认继续。</p>
            <div data-mobile-actions class="flex justify-end gap-3 pt-5">
                <button type="button" id="cancel-confirm-btn" class="px-4 py-2.5 rounded-xl text-sm font-medium border" style="border-color: var(--border-color);">取消</button>
                <button type="button" id="confirm-action-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-red-500 text-white hover:bg-red-600">删除</button>
            </div>
        </div>
    </div>

    <div id="edit-modal-overlay" data-mobile-dialog class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div data-mobile-panel class="card-box rounded-2xl shadow-2xl p-6 w-full max-w-md">
            <div class="flex items-start justify-between gap-4 mb-4">
                <h2 id="edit-modal-title" class="text-xl font-bold">编辑记录</h2>
                <button type="button" id="close-edit-btn" class="icon-btn w-8 h-8 rounded-lg flex items-center justify-center opacity-60 hover:opacity-100" aria-label="关闭编辑弹窗" title="关闭">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-index">
                <input type="hidden" id="edit-version">
                <div>
                    <label for="edit-time" class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">记录时间</label>
                    <input type="text" id="edit-time" class="w-full px-3.5 py-2.5 rounded-xl border bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" style="border-color: var(--border-color);" required>
                    <p class="text-xs opacity-50 mt-1">年/月/日 时:分:秒</p>
                </div>
                <div id="edit-end-field" hidden>
                    <label for="edit-end">结束时间</label>
                    <input id="edit-end" type="text" class="w-full px-3.5 py-2.5 rounded-xl border text-sm bg-transparent">
                </div>
                <div>
                    <div id="edit-tags" class="record-tags"></div>
                    <label for="edit-remark" class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">备注</label>
                    <textarea id="edit-remark" rows="3" maxlength="240" class="w-full px-3.5 py-2.5 rounded-xl border bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" style="border-color: var(--border-color);"></textarea>
                </div>
                <div data-mobile-actions class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancel-edit-btn" class="px-4 py-2.5 rounded-xl text-sm font-medium border" style="border-color: var(--border-color);">取消</button>
                    <button type="submit" id="save-edit-btn" class="btn-theme-primary px-5 py-2.5 rounded-xl text-sm font-medium shadow-md">保存更改</button>
                </div>
            </form>
        </div>
    </div>

    <input type="file" id="csv-file-input" class="hidden" accept=".csv">
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 sm:left-auto sm:right-6 sm:translate-x-0 bg-gray-900/90 text-white backdrop-blur px-5 py-3 rounded-2xl shadow-2xl opacity-0 translate-y-10 z-50 text-sm font-medium flex items-center gap-2 pointer-events-none transition-all duration-300">
        <i id="toast-icon" class="fa fa-info-circle"></i>
        <span id="toast-message"></span>
    </div>

    <header id="home-records-header" class="home-header">
        <div class="home-brand"><span class="nb-brand-icon"><i class="fa fa-clock-o" aria-hidden="true"></i></span><h1>时间笔记</h1></div>
        <div id="offline-status" class="offline-status" role="status" aria-live="polite">
            <button id="offline-info" type="button" aria-label="离线已就绪，查看说明" aria-controls="offline-message" aria-expanded="false" hidden><i class="fa fa-check-circle-o" aria-hidden="true"></i></button>
            <span id="offline-message">正在准备离线使用…</span>
            <button id="offline-retry" type="button" hidden>重试准备</button>
        </div>
    </header>
    <main class="nb-main flex-grow">
        <div hidden><div id="timer-feedback-root" hidden></div></div>
        <div id="home-records-view">
        <!-- 标签页切换 -->
        <div class="nb-mode-tabs max-w-2xl mx-auto mb-6 p-1 rounded-xl grid grid-cols-2 gap-1 border" style="background-color: var(--bg-card); border-color: var(--border-color);" role="tablist" aria-label="数据存储方式">
            <button id="tab-local" role="tab" aria-selected="true" aria-controls="content-local" class="tab-btn active py-2.5 rounded-lg font-semibold text-sm transition-all shadow-sm"><i class="fa fa-laptop mr-1.5 opacity-70"></i>本地记录</button>
            <button id="tab-gist" role="tab" aria-selected="false" aria-controls="content-gist" class="tab-btn py-2.5 rounded-lg font-semibold text-sm transition-all"><i class="fa fa-cloud mr-1.5 opacity-70"></i>云端记录</button>
        </div>

        <!-- 本地版内容 -->
        <div id="content-local" role="tabpanel" aria-labelledby="tab-local">
            <div class="app-stack max-w-3xl mx-auto">
                <div class="card-box hero-card entry-card">
                    <div class="entry-top"><span>距上次记录</span><span class="record-location">本机保存</span></div>
                    <div class="entry-now">
                        <strong id="local-last-record">—</strong>
                        <button id="local-record-btn" data-mobile-focus-fallback aria-label="记录当前时间" class="btn-theme-primary"><i class="fa fa-plus" aria-hidden="true"></i> 记现在</button>
                    </div>
                    <div class="entry-summary"><span>今日 <b id="local-today-count">0</b> 条</span><span>本周 <b id="local-week-count">0</b> 条</span><time id="local-current-time"></time></div>
                    <button type="button" id="local-timer-btn" class="entry-timer" hidden>开始计时</button>
                    <button type="button" id="local-timer-cancel" class="entry-timer" hidden>取消计时</button>
                    <div id="local-receipt" class="entry-receipt" hidden>
                        <p role="status"></p><div><button type="button" data-receipt="note">补备注</button><button type="button" data-receipt="undo">撤销</button><button type="button" data-receipt="retry" hidden>重试</button></div>
                    </div>
                </div>

                <!-- 记录列表卡片 -->
                <div class="record-panel card-box rounded-2xl shadow-sm p-5 sm:p-6">
                    <section id="local-calendar" class="record-calendar" aria-label="本地记录月历"></section>
                    <div class="flex items-center justify-between mb-3 pb-3 border-b" style="border-color: var(--border-color);">
                        <div class="flex items-center gap-2">
                            <h2 id="local-list-title" class="font-bold text-base">全部记录</h2>
                            <span id="local-record-count-badge" class="px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-500">0</span>
                            <button type="button" id="local-backfill" class="entry-backfill" hidden>补记这天</button>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button id="local-import-btn" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium hover:opacity-80 flex items-center gap-1" style="border-color: var(--border-color);">
                                <i class="fa fa-upload"></i> 导入
                            </button>
                            <button id="local-download-btn" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium hover:opacity-80 flex items-center gap-1" style="border-color: var(--border-color);">
                                <i class="fa fa-download"></i> 导出
                            </button>
                        </div>
                    </div>

                    <!-- 动态高/滑动容器 -->
                    <div id="local-records-container" class="space-y-2.5 custom-scrollbar transition-all duration-200">
                        <p class="text-center py-6 text-xs opacity-50">暂无任何记录</p>
                    </div>

                    <!-- 展开 / 收起 切换按钮 -->
                    <div id="local-expand-wrapper" class="mt-3 pt-3 border-t text-center hidden" style="border-color: var(--border-color);">
                        <button id="local-expand-btn" class="text-xs font-semibold py-1.5 px-4 rounded-xl border hover:opacity-80 inline-flex items-center gap-1.5" style="border-color: var(--border-color); color: var(--primary);">
                            <span>展开滑动查看全部</span>
                            <i class="fa fa-chevron-down text-[10px]"></i>
                        </button>
                    </div>
                </div>

                <!-- 数据统计卡片 -->
                <div class="stats-panel card-box rounded-2xl shadow-sm p-5 sm:p-6">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b" style="border-color: var(--border-color);">
                        <h2 class="font-bold text-base">数据统计</h2>
                        <div class="flex items-center gap-1.5">
                            <label class="text-xs opacity-60">年份:</label>
                            <select id="local-year-select" class="px-2.5 py-1 rounded-lg border text-xs font-medium bg-transparent focus:outline-none" style="border-color: var(--border-color);">
                            </select>
                        </div>
                    </div>

                    <div class="space-y-5">
                        <div class="rounded-xl p-3 border" style="border-color: var(--border-color); background-color: var(--table-header);">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-medium opacity-80" id="local-summary-label">年度记录条数</span>
                                <span class="text-lg font-bold" id="local-summary-value">0 条</span>
                            </div>
                        </div>
                        <div>
                            <p class="text-xs font-semibold opacity-70 mb-3">每月记录趋势分析</p>
                            <div class="w-full h-56 sm:h-64">
                                <canvas id="local-records-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 云端同步版内容 -->
        <div id="content-gist" class="hidden" role="tabpanel" aria-labelledby="tab-gist">
            <div class="app-stack max-w-3xl mx-auto">
                <div class="card-box hero-card entry-card">
                    <div class="entry-top"><span>距上次记录</span><span id="gist-sync-status" class="record-location">等待同步</span></div>
                    <div class="entry-now">
                        <strong id="gist-last-record">—</strong>
                        <button id="gist-record-btn" aria-label="记录当前时间到云端" class="btn-theme-primary"><i class="fa fa-plus" aria-hidden="true"></i> 记现在</button>
                    </div>
                    <div class="entry-summary"><span>今日 <b id="gist-today-count">0</b> 条</span><span>本周 <b id="gist-week-count">0</b> 条</span><time id="gist-current-time"></time></div>
                    <button type="button" id="gist-timer-btn" class="entry-timer" hidden>开始计时</button>
                    <button type="button" id="gist-timer-cancel" class="entry-timer" hidden>取消计时</button>
                    <div id="gist-receipt" class="entry-receipt" hidden>
                        <p role="status"></p><div><button type="button" data-receipt="note">补备注</button><button type="button" data-receipt="undo">撤销</button><button type="button" data-receipt="retry" hidden>重试</button></div>
                    </div>
                </div>

                <!-- 记录列表卡片 -->
                <div class="record-panel card-box rounded-2xl shadow-sm p-5 sm:p-6">
                    <section id="gist-calendar" class="record-calendar" aria-label="云端记录月历"></section>
                    <div class="flex items-center justify-between mb-3 pb-3 border-b" style="border-color: var(--border-color);">
                        <div class="flex items-center gap-2">
                            <h2 id="gist-list-title" class="font-bold text-base">全部记录</h2>
                            <span id="gist-record-count-badge" class="px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-500">0</span>
                            <button type="button" id="gist-backfill" class="entry-backfill" hidden>补记这天</button>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button id="gist-import-btn" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium hover:opacity-80 flex items-center gap-1" style="border-color: var(--border-color);">
                                <i class="fa fa-upload"></i> 导入
                            </button>
                            <button id="gist-download-btn" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium hover:opacity-80 flex items-center gap-1" style="border-color: var(--border-color);">
                                <i class="fa fa-download"></i> 导出
                            </button>
                            <button id="gist-config-open-btn" aria-label="打开云端配置" title="云端配置" class="icon-btn w-8 h-8 rounded-lg border text-xs font-medium hover:opacity-80 flex items-center justify-center" style="border-color: var(--border-color);">
                                <i class="fa fa-sliders"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 动态高/滑动容器 -->
                    <div id="gist-records-container" class="space-y-2.5 custom-scrollbar transition-all duration-200">
                        <p class="text-center py-6 text-xs opacity-50">正在连接云端...</p>
                    </div>

                    <!-- 展开 / 收起 切换按钮 -->
                    <div id="gist-expand-wrapper" class="mt-3 pt-3 border-t text-center hidden" style="border-color: var(--border-color);">
                        <button id="gist-expand-btn" class="text-xs font-semibold py-1.5 px-4 rounded-xl border hover:opacity-80 inline-flex items-center gap-1.5" style="border-color: var(--border-color); color: var(--primary);">
                            <span>展开滑动查看全部</span>
                            <i class="fa fa-chevron-down text-[10px]"></i>
                        </button>
                    </div>
                </div>

                <!-- 数据统计卡片 -->
                <div class="stats-panel card-box rounded-2xl shadow-sm p-5 sm:p-6">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b" style="border-color: var(--border-color);">
                        <h2 class="font-bold text-base">数据统计 (云端)</h2>
                        <div class="flex items-center gap-1.5">
                            <label class="text-xs opacity-60">年份:</label>
                            <select id="gist-year-select" class="px-2.5 py-1 rounded-lg border text-xs font-medium bg-transparent focus:outline-none" style="border-color: var(--border-color);">
                            </select>
                        </div>
                    </div>

                    <div class="space-y-5">
                        <div class="rounded-xl p-3 border" style="border-color: var(--border-color); background-color: var(--table-header);">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-medium opacity-80" id="gist-summary-label">年度记录条数</span>
                                <span class="text-lg font-bold" id="gist-summary-value">0 条</span>
                            </div>
                        </div>
                        <div>
                            <p class="text-xs font-semibold opacity-70 mb-3">每月记录趋势分析</p>
                            <div class="w-full h-56 sm:h-64">
                                <canvas id="gist-records-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        </div><!-- home-records-view -->
        <section id="home-tools-view" aria-labelledby="tools-title" hidden>
            <h1 class="home-heading" id="tools-title">工具</h1>
            <div id="tool-directory"></div>
        </section>
        <section id="home-profile-view" aria-label="个人" hidden></section>
    </main>
    <section id="home-desk-view" aria-label="朋友留言" hidden>
        <div id="home-desk-status" role="status">
            <p id="home-desk-message">正在打开朋友留言…</p>
            <button type="button" id="home-desk-retry" hidden>重试</button>
        </div>
    </section>
    <nav id="mobile-home-nav" aria-label="主导航">
        <button data-page="records" type="button" id="home-show-records" aria-controls="home-records-view" aria-current="page"><i class="fa fa-calendar-o" aria-hidden="true"></i>记录</button>
        <button data-page="friends" type="button" id="home-show-feedback" aria-controls="home-desk-view"><i class="fa fa-comment-o" aria-hidden="true"></i>朋友<span id="home-unread" hidden></span></button>
        <button data-page="tools" type="button" id="home-show-tools" aria-controls="home-tools-view"><i class="fa fa-th-large" aria-hidden="true"></i>工具</button>
        <button data-page="personal" type="button" id="home-show-profile" aria-controls="home-profile-view"><i class="fa fa-user-o" aria-hidden="true"></i>个人</button>
    </nav>

<script src="assets/js/records.js"></script>
<script src="assets/js/record-actions.js"></script>
<script src="assets/js/feedback-core.js"></script>
<script src="assets/js/feedback-ui.js"></script>
<script src="assets/js/profile.js"></script>
<script src="assets/js/tool-directory.js"></script>
<script src="assets/js/home-desk.js"></script>
<script src="assets/js/home-navigation.js"></script>
</body>
</html>
