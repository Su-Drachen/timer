<!DOCTYPE html>
<html lang="zh-CN" data-theme="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时间笔记</title>
    <!-- 基础 CDN 依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        theme: {
                            blue: '#165DFF',
                            green: '#00B42A',
                            red: '#F53F3F',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS 变量管理三大主题 */
        :root[data-theme="blue"] {
            --bg-page: #F4F7FC;
            --bg-card: #FFFFFF;
            --bg-header: linear-gradient(135deg, #165DFF 0%, #0E42D2 100%);
            --header-text: #FFFFFF;
            --primary: #165DFF;
            --primary-hover: #0E42D2;
            --primary-light: #E8F3FF;
            --text-main: #1D2129;
            --text-sub: #86909C;
            --border-color: #E5E6EB;
            --table-header: #F2F3F5;
            --chart-border: #165DFF;
            --chart-bg: rgba(22, 93, 255, 0.15);
            --scrollbar-thumb: #D8DFE9;
        }

        :root[data-theme="white"] {
            --bg-page: #F8F9FA;
            --bg-card: #FFFFFF;
            --bg-header: #FFFFFF;
            --header-text: #18181B;
            --primary: #18181B;
            --primary-hover: #27272A;
            --primary-light: #F4F4F5;
            --text-main: #18181B;
            --text-sub: #71717A;
            --border-color: #E4E4E7;
            --table-header: #F4F4F5;
            --chart-border: #18181B;
            --chart-bg: rgba(24, 24, 27, 0.12);
            --scrollbar-thumb: #E4E4E7;
        }

        :root[data-theme="dark"] {
            --bg-page: #0B0F19;
            --bg-card: #151D2C;
            --bg-header: #151D2C;
            --header-text: #F1F5F9;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --primary-light: #1E293B;
            --text-main: #F1F5F9;
            --text-sub: #94A3B8;
            --border-color: #232F46;
            --table-header: #1A2336;
            --chart-border: #3B82F6;
            --chart-bg: rgba(59, 130, 246, 0.2);
            --scrollbar-thumb: #2B384E;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .card-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .btn-theme-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }
        .btn-theme-primary:hover {
            background-color: var(--primary-hover);
        }

        .header-bg {
            background: var(--bg-header);
            color: var(--header-text);
        }

        /* 精细自定义滑动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar-thumb);
            border-radius: 9999px;
        }

        button, a {
            transition: transform 0.1s ease, background-color 0.2s ease, opacity 0.2s ease;
        }
        button:active, a:active {
            transform: scale(0.97);
        }

        .tab-btn {
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            background: var(--bg-card);
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

    <!-- ==== 全局模态框与Toast提示 ==== -->

    <!-- Gist 配置模态框 -->
    <div id="gist-config-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
        <div class="card-box rounded-2xl shadow-2xl p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-2">云同步配置 (Gist)</h2>
            <p class="text-sm opacity-70 mb-5 leading-relaxed">请填入 GitHub 账户信息与拥有 Gist 权限的个人访问令牌 (PAT)。</p>
            <form id="gist-config-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">用户名 (Username)</label>
                    <input type="text" id="gist-username" class="w-full px-3.5 py-2.5 rounded-xl border bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" style="border-color: var(--border-color);" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Gist ID</label>
                    <input type="text" id="gist-gistId" class="w-full px-3.5 py-2.5 rounded-xl border bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" style="border-color: var(--border-color);" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">访问令牌 (PAT Token)</label>
                    <input type="password" id="gist-pat" class="w-full px-3.5 py-2.5 rounded-xl border bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" style="border-color: var(--border-color);" required>
                </div>
                <button type="submit" class="w-full btn-theme-primary font-medium py-3 px-4 rounded-xl shadow-lg mt-2">保存并开始同步</button>
            </form>
        </div>
    </div>

    <!-- 通用编辑记录模态框 -->
    <div id="edit-modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
        <div class="card-box rounded-2xl shadow-2xl p-6 w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">编辑记录</h2>
            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-version">
                <input type="hidden" id="edit-index">

                    <input type="text" id="edit-time" class="w-full px-3.5 py-2.5 rounded-xl border bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" style="border-color: var(--border-color);" required>
                    <p class="text-xs opacity-50 mt-1">格式: YYYY/MM/DD HH:MM:SS</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">备注内容</label>
                    <textarea id="edit-remark" rows="3" class="w-full px-3.5 py-2.5 rounded-xl border bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" style="border-color: var(--border-color);"></textarea>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancel-edit-btn" class="px-4 py-2.5 rounded-xl text-sm font-medium border" style="border-color: var(--border-color);">取消</button>

    <!-- 应用全局调度脚本 -->
    <script>
        const AppUI = {
            toastTimer: null,
            gistInitialized: false,

            showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                const toastMessage = document.getElementById('toast-message');
                const toastIcon = document.getElementById('toast-icon');

                toastMessage.textContent = message;
                toastIcon.className = 'fa ' + (type === 'success' ? 'fa-check-circle text-green-400' : type === 'error' ? 'fa-times-circle text-red-400' : 'fa-info-circle text-blue-400');

                toast.classList.remove('opacity-0', 'translate-y-10');
                if (this.toastTimer) clearTimeout(this.toastTimer);
                this.toastTimer = setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-10');
                }, 2800);
            },

            switchTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('userTheme', theme);

                ['blue', 'white', 'dark'].forEach(t => {
                    const btn = document.getElementById(`theme-btn-${t}`);
                    if (!btn) return;
                    if (t === theme) {
                        btn.classList.add('bg-white/20', 'shadow-sm');
                    } else {
                        btn.classList.remove('bg-white/20', 'shadow-sm');
                    }
                });

                if (window.StatsManager) {
                    StatsManager.updateChartsTheme();
                }
            },

            initTheme() {
                const savedTheme = localStorage.getItem('userTheme') || 'blue';
                this.switchTheme(savedTheme);
            },

            updateClock() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                const localClock = document.getElementById('local-current-time');
                const gistClock = document.getElementById('gist-current-time');
                if (localClock) localClock.textContent = timeString;
                if (gistClock) gistClock.textContent = timeString;
            }
        };

        // DOM 加载就绪后启动整体流程
        document.addEventListener('DOMContentLoaded', () => {
            AppUI.initTheme();
            AppUI.updateClock();
            setInterval(() => AppUI.updateClock(), 1000);

            // 初始化数据层与视图层
            DataStore.init();
            RecordManager.init();
            StatsManager.init();

            // 选项卡切换
            const tabLocal = document.getElementById('tab-local');
            const tabGist = document.getElementById('tab-gist');
            const contentLocal = document.getElementById('content-local');
            const contentGist = document.getElementById('content-gist');

            tabLocal.addEventListener('click', () => {
                tabLocal.classList.add('active');
                tabGist.classList.remove('active');
                contentLocal.classList.remove('hidden');
                contentGist.classList.add('hidden');
            });

            tabGist.addEventListener('click', () => {
                tabGist.classList.add('active');
                tabLocal.classList.remove('active');
                contentGist.classList.remove('hidden');
                contentLocal.classList.add('hidden');

                if (!AppUI.gistInitialized) {
                    DataStore.initGist();
                    AppUI.gistInitialized = true;
                }
            });
        });
    </script>
</body>
</html>
