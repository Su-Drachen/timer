    <!-- PWA 配置文件关联 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="百度">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20vh 15px 0;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .logo {
            max-width: 220px;
            width: 100%;
            height: auto;
            margin-bottom: 25px;
        }

        .search-container {
            display: flex;
            width: 100%;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            height: 44px;
            padding: 0 16px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-right: none;
            border-radius: 22px 0 0 22px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: #4e6ef2;
            box-shadow: 0 0 5px rgba(78, 110, 242, 0.3);
        }

        .search-button {
            width: 100px;
            height: 44px;
            background-color: #4e6ef2;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 0 22px 22px 0;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-button:active {
            background-color: #4159c3;
        }

        @media (min-width: 768px) {
            body {
                align-items: center;
                padding-top: 0;
                padding-bottom: 10vh;
            }
            .search-button:hover {
                background-color: #4159c3;
            }
            .search-button {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 百度 Logo -->
        <img src="https://www.baidu.com/img/PCtm_d9c8750bed0b3c7d089fa7d55720d6cf.png" alt="Baidu Logo" class="logo">

        <div id="searchContainer" class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="时间搜索不一样的搜索！" autocomplete="off">
            <button type="button" id="searchButton" class="search-button">百度一下</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const PASSWORD_KEY = 'mySecretDecoyPassword';
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');

            searchButton.addEventListener('click', processInput);

            searchInput.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    processInput();
                }
            });

            function processInput() {
                const inputValue = searchInput.value.trim();

                if (inputValue === '') {
                    return;
                }

                // 输入“重置密码”时无提示静默重置
                if (inputValue === '重置密码') {
                    localStorage.removeItem(PASSWORD_KEY);
                    searchInput.value = '';
                    return;
                }

                const storedPassword = localStorage.getItem(PASSWORD_KEY);

                // 首次搜索：静默将当前输入内容设为密码，并执行一次百度搜索
                if (!storedPassword) {
                    localStorage.setItem(PASSWORD_KEY, inputValue);
                    const searchUrl = 'https://www.baidu.com/s?wd=' + encodeURIComponent(inputValue);
                    window.open(searchUrl, '_blank');
                    return;
                }

                // 命中密码跳转后台页面，否则正常搜索
                if (inputValue === storedPassword) {
                    window.location.href = 'pagemain.html';
                } else {
                    const searchUrl = 'https://www.baidu.com/s?wd=' + encodeURIComponent(inputValue);
                    window.open(searchUrl, '_blank');
                }
            }
        });
    </script>

</body>
</html>
