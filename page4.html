<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>使用记录分析 - 私人时间记录器</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            '50': '#eff6ff', '100': '#dbeafe', '200': '#bfdbfe', '300': '#93c5fd', '400': '#60a5fa', '500': '#3b82f6', '600': '#2563eb', '700': '#1d4ed8', '800': '#1e40af', '900': '#1e3a8a',
                        },
                        success: '#22c55e',
                        danger: '#ef4444',
                        warning: '#f97316',
                    },
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .transition-all {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:active, a:active {
            transform: scale(0.97);
        }
        .filter-btn {
            border: 1px solid #e2e8f0;
            color: #64748b;
            background: #ffffff;
            transition: all 0.2s ease;
        }
        .filter-btn.active {
            background-color: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans antialiased text-slate-800">

    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-200/80">
        <div class="container mx-auto px-3.5 sm:px-4 py-3 sm:py-3.5 flex justify-between items-center max-w-4xl">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-500 flex items-center justify-center">
                    <i class="fa fa-heartbeat text-lg"></i>
                </div>
                <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-800">
                    行为与时长分析
                </h1>
            </div>
            <div class="flex items-center gap-1.5 sm:gap-2">
                <button onclick="fetchRecordsAndProcess()" id="refresh-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors flex items-center text-xs sm:text-sm font-semibold py-1.5 px-2.5 sm:px-3 rounded-lg" title="从云端获取最新实时数据">
                    <i class="fa fa-refresh mr-1"></i>
                    <span>刷新</span>
                </button>
                <a href="pagemain.html" class="bg-slate-200 text-slate-700 hover:bg-slate-300 transition-colors flex items-center text-xs sm:text-sm font-semibold py-1.5 px-2.5 sm:px-3 rounded-lg">
                    <i class="fa fa-arrow-left mr-1"></i>
                    返回
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-3.5 sm:px-4 py-4 sm:py-6 max-w-4xl space-y-4 sm:space-y-6">

        <!-- 主要内容挂载点 -->
        <div id="health-app-container" class="space-y-4 sm:space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center text-slate-500">
                <i class="fa fa-spinner fa-spin text-2xl mr-2 text-primary-500"></i>
                <span class="text-sm">正在获取实时数据并计算...</span>
            </div>
        </div>

    </main>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 sm:left-auto sm:right-6 sm:translate-x-0 flex items-center text-white text-xs sm:text-sm py-2.5 px-4 rounded-xl shadow-2xl opacity-0 translate-y-10 z-50 transition-all pointer-events-none">
        <div id="toast-icon" class="mr-2"></div>
        <p id="toast-message"></p>
    </div>

    <!-- 页脚 -->
    <footer class="text-slate-400 py-5 mt-auto border-t border-slate-200/60">
        <div class="container mx-auto px-4 text-center text-xs">
            © 私人时间记录器 · 行为数据与 AI 提示助手 (只读模式)
        </div>
    </footer>

    <script>
        // --- 全局状态 ---
        let config = { GITHUB_USERNAME: "", GIST_ID: "", GITHUB_PAT: "" };
        let localRecords = [];
        let gistRecords = [];
        let allMatchedPairs = [];
        let currentFilter = 'count_7';
        let chartInstance = null;
        let generatedPromptText = "";

        // --- 进阶鉴权检查 ---
        function readTimeRecorderConfig() {
            let stored = {};
            try {
                const savedConfig = localStorage.getItem('timeRecorderConfig');
                stored = savedConfig ? JSON.parse(savedConfig) : {};
            } catch (error) {
                console.warn('读取云端配置失败', error);
            }
            let sessionPat = sessionStorage.getItem('timeRecorderPat');
            if (stored.GITHUB_PAT) {
                if (!sessionPat) {
                    sessionPat = stored.GITHUB_PAT;
                    try { sessionStorage.setItem('timeRecorderPat', sessionPat); } catch (error) { console.warn('无法迁移会话令牌', error); }
                }
                delete stored.GITHUB_PAT;
                try { localStorage.setItem('timeRecorderConfig', JSON.stringify(stored)); } catch (error) { console.warn('无法更新云端配置', error); }
            }
            return { ...stored, GITHUB_PAT: sessionPat || stored.GITHUB_PAT || '' };
        }

        function loadConfig() {
            config = readTimeRecorderConfig();
            if (config.GIST_ID && config.GITHUB_PAT) {
                return true;
            } else {
                const container = document.getElementById('health-app-container');
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 text-center py-10 px-4">
                        <i class="fa fa-lock text-3xl sm:text-4xl text-warning mb-3"></i>
                        <h3 class="text-base sm:text-lg font-bold text-slate-800">云端配置不完整</h3>
                        <p class="text-slate-500 my-2 text-xs sm:text-sm max-w-sm mx-auto leading-relaxed">
                            该分析需要依赖「云端同步数据」与「本地打卡数据」进行时序闭环匹配。
                        </p>
                        <a href="pagemain.html?tab=gist&config=1" class="mt-4 inline-block bg-primary-500 text-white text-xs sm:text-sm py-2.5 px-6 rounded-xl hover:bg-primary-600 transition-colors font-semibold shadow-md">
                            前往云端配置
                        </a>
                    </div>
                `;
                return false;
            }
        }

        // --- Toast 提示函数 ---
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;
            toast.classList.remove('bg-emerald-600', 'bg-rose-600', 'bg-amber-600', 'bg-slate-900');

            let iconHtml = '';
            switch (type) {
                case 'success':
                    toast.classList.add('bg-emerald-600');
                    iconHtml = '<i class="fa fa-check-circle"></i>';
                    break;
                case 'error':
                    toast.classList.add('bg-rose-600');
                    iconHtml = '<i class="fa fa-times-circle"></i>';
                    break;
                case 'warning':
                    toast.classList.add('bg-amber-600');
                    iconHtml = '<i class="fa fa-exclamation-triangle"></i>';
                    break;
                default:
                    toast.classList.add('bg-slate-900');
                    iconHtml = '<i class="fa fa-info-circle"></i>';
            }
            toastIcon.innerHTML = iconHtml;

            toast.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10');
            }, 2800);
        }

        // --- 直连 GitHub REST API (无缓存) ---
        async function fetchDirectFromGitHubApi() {
            const res = await fetch(`https://api.github.com/gists/${config.GIST_ID}`, {
                headers: {
                    'Authorization': `token ${config.GITHUB_PAT}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                cache: 'no-store'
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `API 错误 (${res.status})`);
            }
            const data = await res.json();
            const file = data.files && data.files['records.json'];
            if (!file || !file.content) return [];
            try {
                const records = JSON.parse(file.content);
                return Array.isArray(records) ? records : [];
            } catch (error) {
                throw new Error('云端 records.json 格式无效');
            }
        }

        // --- 数据加载与只读处理 ---
        async function fetchRecordsAndProcess() {
            const refreshBtn = document.getElementById('refresh-btn');
            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i><span>同步中</span>';
            }

            try {
                const savedLocal = localStorage.getItem('timeRecords');
                localRecords = savedLocal ? JSON.parse(savedLocal) : [];
                if (!Array.isArray(localRecords)) localRecords = [];
            } catch (error) {
                console.warn('读取本地记录失败', error);
                localRecords = [];
            }

            try {
                const realTimeGistData = await fetchDirectFromGitHubApi();
                gistRecords = Array.isArray(realTimeGistData) ? realTimeGistData : [];

                matchRecordsReadOnly();
                renderHealthDashboard();
                showToast("已同步最新实时数据！", "success");
            } catch (error) {
                console.error("实时同步失败:", error);
                showToast(`同步失败: ${error.message}`, "error");
                document.getElementById('health-app-container').innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 text-center py-10 px-4 text-rose-600">
                        <i class="fa fa-exclamation-triangle text-3xl mb-3"></i>
                        <h3 class="text-base font-bold text-slate-800">无法拉取云端实时数据</h3>
                        <p class="my-2 text-slate-500 text-xs">${error.message}</p>
                        <button onclick="fetchRecordsAndProcess()" class="mt-3 px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-medium">重试连接</button>
                    </div>
                `;
            } finally {
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '<i class="fa fa-refresh mr-1"></i><span>刷新</span>';
                }
            }
        }

        // --- 双向只读时间轴匹配 (过滤 <1分钟 间隔，<=12小时) ---
        function matchRecordsReadOnly() {
            allMatchedPairs = [];
            if (!localRecords.length || !gistRecords.length) return;

            const unifiedEvents = [];

            localRecords.forEach((r) => {
                const ts = new Date(r.time.replace(/\//g, '-')).getTime();
                if (!isNaN(ts)) {
                    unifiedEvents.push({
                        type: 'local',
                        time: r.time,
                        remark: r.remark || '',
                        timestamp: ts,
                        used: false
                    });
                }
            });

            gistRecords.forEach((r) => {
                const ts = new Date(r.time.replace(/\//g, '-')).getTime();
                if (!isNaN(ts)) {
                    unifiedEvents.push({
                        type: 'gist',
                        time: r.time,
                        remark: r.remark || '',
                        timestamp: ts,
                        used: false
                    });
                }
            });

            unifiedEvents.sort((a, b) => a.timestamp - b.timestamp);
            const MIN_INTERVAL_MS = 60 * 1000;
            const MAX_INTERVAL_MS = 12 * 60 * 60 * 1000;

            for (let i = 0; i < unifiedEvents.length; i++) {
                const current = unifiedEvents[i];
                if (current.used) continue;

                for (let j = i + 1; j < unifiedEvents.length; j++) {
                    const target = unifiedEvents[j];
                    if (!target.used && target.type !== current.type) {
                        const diffMs = target.timestamp - current.timestamp;

                        if (diffMs >= MIN_INTERVAL_MS && diffMs <= MAX_INTERVAL_MS) {
                            current.used = true;
                            target.used = true;

                            const diffMinutes = Math.round(diffMs / (1000 * 60));
                            const isCrossDay = new Date(current.timestamp).getDate() !== new Date(target.timestamp).getDate();
                            const direction = current.type === 'local' ? 'local_to_gist' : 'gist_to_local';

                            allMatchedPairs.push({
                                start: { time: current.time, remark: current.remark },
                                end: { time: target.time, remark: target.remark },
                                direction: direction,
                                startTimestamp: current.timestamp,
                                endTimestamp: target.timestamp,
                                durationMinutes: diffMinutes,
                                isCrossDay: isCrossDay
                            });
                            break;
                        }
                    }
                }
            }

            allMatchedPairs.sort((a, b) => b.startTimestamp - a.startTimestamp);
        }

        // --- 格式化时长显示 ---
        function formatMinutes(minutes) {
            if (minutes < 60) return `${minutes} 分钟`;
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return m === 0 ? `${h} 小时` : `${h}h ${m}m`;
        }

        // --- 根据 Filter 过滤配对列表 ---
        function getFilteredPairs() {
            if (allMatchedPairs.length === 0) return [];
            const now = new Date().getTime();

            switch (currentFilter) {
                case 'count_7': return allMatchedPairs.slice(0, 7);
                case 'count_30': return allMatchedPairs.slice(0, 30);
                case 'days_7': return allMatchedPairs.filter(p => now - p.startTimestamp <= 7 * 86400000);
                case 'days_30': return allMatchedPairs.filter(p => now - p.startTimestamp <= 30 * 86400000);
                case 'days_180': return allMatchedPairs.filter(p => now - p.startTimestamp <= 180 * 86400000);
                case 'all': default: return [...allMatchedPairs];
            }
        }

        // --- 计算众数区间 (30 分钟步长) ---
        function calculateModeRange(minutesArray) {
            if (!minutesArray.length) return '--';
            const bucketCount = {};
            const BUCKET_SIZE = 30;

            minutesArray.forEach(m => {
                const bucketIndex = Math.floor(m / BUCKET_SIZE);
                const bucketStart = bucketIndex * BUCKET_SIZE;
                const bucketEnd = bucketStart + BUCKET_SIZE;
                const key = `${bucketStart}-${bucketEnd}`;
                bucketCount[key] = (bucketCount[key] || 0) + 1;
            });

            let maxFreq = 0;
            let modeKey = '';
            for (const key in bucketCount) {
                if (bucketCount[key] > maxFreq) {
                    maxFreq = bucketCount[key];
                    modeKey = key;
                }
            }

            if (!modeKey) return '--';
            const [start, end] = modeKey.split('-');
            return `${start}~${end}分`;
        }

        // --- 核心：构造 AI 提问提示词模板 ---
        function generateAIPrompt() {
            if (!allMatchedPairs.length) return "";

            const latest = allMatchedPairs[0];
            const recent10 = allMatchedPairs.slice(0, 10);
            const recentDurations = recent10.map(p => p.durationMinutes);
            const avgRecent = Math.round(recentDurations.reduce((a, b) => a + b, 0) / recentDurations.length);
            const maxRecent = Math.max(...recentDurations);
            const minRecent = Math.min(...recentDurations);

            let recentListText = recent10.map((p, idx) => {
                const remarkPart = (p.start.remark || p.end.remark) ? ` (备注: ${p.start.remark || p.end.remark})` : '';
                return `${idx + 1}. [${p.start.time} 至 ${p.end.time}] 单次历时: ${p.durationMinutes}分钟${p.isCrossDay ? ' (跨天/深夜)' : ''}${remarkPart}`;
            }).join('\n');

            return `你是一名专业、温和且具有循证医学背景的性健康与生活方式顾问。我记录了自己近期的自慰（手淫）行为时间数据（已通过计时工具准确记录了单次起始与结束时间）。请根据我的客观记录数据，为我提供一份科学、客观、无道德评判的健康分析与建议。

【最新 1 次行为数据】
- 开始时间：${latest.start.time}
- 结束时间：${latest.end.time}
- 单次持续时长：${latest.durationMinutes} 分钟 (${formatMinutes(latest.durationMinutes)})
- 是否跨午夜/深夜：${latest.isCrossDay ? '是 (涉及夜间/跨日)' : '否'}
- 记录备注：${latest.start.remark || latest.end.remark || '无'}

【近期行为历史概况 (近 ${recent10.length} 次记录)】
- 样本平均单次时长：${avgRecent} 分钟
- 样本单次最长时间：${maxRecent} 分钟
- 样本单次最短时间：${minRecent} 分钟
- 近期明细清单：
${recentListText}

【请从以下几个维度为我分析并提供建议】
1. **持续时长评估**：结合最新一次和近期的平均持续时间，从生殖泌尿系统负担（如前列腺充血、黏膜过度摩擦等）角度，评估单次时长是否处于合理生理区间？
2. **发生频率与时间规律**：根据近期的记录时间间隔与发生时段（如是否集中在深夜影响作息），评估当前的节律是否健康？
3. **身心状态与精力调节**：从多巴胺调节、精力恢复、心理放松与专注度维持等角度，提供具体的调节建议与自律提示。
4. **改善行动建议**：如有需要调整的地方，请给出 2~3 条可实操的日常建议。`;
        }

        // --- 一键复制提示词 ---
        async function copyPromptToClipboard() {
            const promptContent = generatedPromptText;
            if (!promptContent) {
                showToast("暂无可复制的提示词数据", "warning");
                return;
            }

            const copyBtn = document.getElementById('copy-prompt-btn');
            const originalHtml = copyBtn.innerHTML;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(promptContent);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = promptContent;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }

                showToast("提示词已复制到剪贴板！", "success");
                copyBtn.classList.remove('bg-primary-500', 'hover:bg-primary-600');
                copyBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                copyBtn.innerHTML = '<i class="fa fa-check mr-1.5"></i>已复制';

                setTimeout(() => {
                    copyBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                    copyBtn.classList.add('bg-primary-500', 'hover:bg-primary-600');
                    copyBtn.innerHTML = originalHtml;
                }, 2000);
            } catch (err) {
                console.error("复制失败:", err);
                showToast("复制失败，请手动选择复制", "error");
            }
        }

        // --- 渲染界面 ---
        function renderHealthDashboard() {
            const container = document.getElementById('health-app-container');

            if (allMatchedPairs.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 text-center py-12 px-4">
                        <i class="fa fa-hourglass-o text-3xl text-slate-300 mb-3"></i>
                        <h3 class="text-base font-bold text-slate-700">暂无有效的使用间隔</h3>
                        <p class="text-slate-400 my-1 max-w-sm mx-auto text-xs leading-relaxed">
                            未能匹配到 1分钟~12小时 以内的「本地与云端」行为闭环（小于1分钟间隔已自动剔除）。
                        </p>
                    </div>
                `;
                return;
            }

            const currentData = getFilteredPairs();
            const durations = currentData.map(p => p.durationMinutes);

            const count = durations.length;
            const minVal = count ? Math.min(...durations) : 0;
            const maxVal = count ? Math.max(...durations) : 0;
            const avgVal = count ? Math.round(durations.reduce((a, b) => a + b, 0) / count) : 0;
            const modeRange = calculateModeRange(durations);

            generatedPromptText = generateAIPrompt();

            container.innerHTML = `
                <!-- 筛选控制器卡片 (手机友好) -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-3">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-sm sm:text-base font-bold text-slate-800">行为间隔趋势</h2>
                            <p class="text-[11px] sm:text-xs text-slate-400">已自动剔除小于 1 分钟的短记录</p>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600 font-bold">
                            有效配对 ${allMatchedPairs.length} 次
                        </span>
                    </div>

                    <!-- 手机端 3列网格，电脑端横向排列 -->
                    <div class="grid grid-cols-3 sm:flex sm:flex-wrap gap-1.5 text-xs pt-1 border-t border-slate-100">
                        <button class="filter-btn ${currentFilter === 'count_7' ? 'active' : ''} py-1.5 px-2 rounded-xl text-center font-medium" onclick="switchFilter('count_7')">近7条</button>
                        <button class="filter-btn ${currentFilter === 'count_30' ? 'active' : ''} py-1.5 px-2 rounded-xl text-center font-medium" onclick="switchFilter('count_30')">近30条</button>
                        <button class="filter-btn ${currentFilter === 'days_7' ? 'active' : ''} py-1.5 px-2 rounded-xl text-center font-medium" onclick="switchFilter('days_7')">近1周</button>
                        <button class="filter-btn ${currentFilter === 'days_30' ? 'active' : ''} py-1.5 px-2 rounded-xl text-center font-medium" onclick="switchFilter('days_30')">近1月</button>
                        <button class="filter-btn ${currentFilter === 'days_180' ? 'active' : ''} py-1.5 px-2 rounded-xl text-center font-medium" onclick="switchFilter('days_180')">近半年</button>
                        <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''} py-1.5 px-2 rounded-xl text-center font-medium" onclick="switchFilter('all')">全部</button>
                    </div>
                </div>

                <!-- 核心指标卡片 (手机 2x2 网格) -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3.5">
                    <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <span class="text-[11px] sm:text-xs text-slate-400 font-medium block">平均单次历时</span>
                        <span class="text-base sm:text-xl font-extrabold text-slate-800 mt-1 block">${count ? formatMinutes(avgVal) : '--'}</span>
                        <span class="text-[10px] text-slate-400 mt-0.5 block">均值水平</span>
                    </div>
                    <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <span class="text-[11px] sm:text-xs text-slate-400 font-medium block">单次最长历时</span>
                        <span class="text-base sm:text-xl font-extrabold text-amber-600 mt-1 block">${count ? formatMinutes(maxVal) : '--'}</span>
                        <span class="text-[10px] text-slate-400 mt-0.5 block">最大时长</span>
                    </div>
                    <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <span class="text-[11px] sm:text-xs text-slate-400 font-medium block">单次最短历时</span>
                        <span class="text-base sm:text-xl font-extrabold text-emerald-600 mt-1 block">${count ? formatMinutes(minVal) : '--'}</span>
                        <span class="text-[10px] text-slate-400 mt-0.5 block">最快闭环</span>
                    </div>
                    <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <span class="text-[11px] sm:text-xs text-slate-400 font-medium block">高频主力区间</span>
                        <span class="text-sm sm:text-base font-extrabold text-primary-600 mt-1.5 block">${modeRange}</span>
                        <span class="text-[10px] text-slate-400 mt-0.5 block">众数分布</span>
                    </div>
                </div>

                <!-- 折线图分析卡片 -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs sm:text-sm font-bold text-slate-800">历时时长曲线 (分钟)</h3>
                        <span class="text-[11px] text-slate-400">已呈现 ${count} 组数据</span>
                    </div>
                    <div class="w-full h-48 sm:h-64">
                        <canvas id="interval-chart"></canvas>
                    </div>
                </div>

                <!-- 新增：AI 健康咨询提示词生成卡片 -->
                <div class="bg-white rounded-2xl shadow-sm border border-indigo-100 p-4 sm:p-5 space-y-3 bg-gradient-to-br from-white via-indigo-50/20 to-blue-50/30">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs">
                                <i class="fa fa-magic"></i>
                            </div>
                            <div>
                                <h3 class="text-xs sm:text-sm font-bold text-slate-800">AI 健康建议提示词</h3>
                                <p class="text-[10px] sm:text-[11px] text-slate-500">已整合「最新 1 条」与「近 10 条」客观数据</p>
                            </div>
                        </div>
                        <button id="copy-prompt-btn" onclick="copyPromptToClipboard()" class="bg-primary-500 hover:bg-primary-600 text-white font-medium text-xs py-1.5 px-3 rounded-xl transition-colors flex items-center shadow-sm active:scale-95">
                            <i class="fa fa-clone mr-1.5"></i>
                            <span>一键复制</span>
                        </button>
                    </div>

                    <!-- 提示词预览框 -->
                    <div class="relative">
                        <pre class="bg-slate-900 text-slate-200 text-[11px] sm:text-xs rounded-xl p-3 sm:p-4 overflow-x-auto whitespace-pre-wrap font-sans leading-relaxed max-h-52 sm:max-h-60 border border-slate-800 select-all">${generatedPromptText}</pre>
                    </div>

                    <p class="text-[11px] text-slate-400 flex items-center gap-1.5 pt-0.5">
                        <i class="fa fa-info-circle text-indigo-500"></i>
                        <span>复制后直接发送给 AI，即可获取专属、客观、科学的生理与作息健康评估。</span>
                    </p>
                </div>

                <!-- 配对流水列表 (手机卡片 / 电脑表格 自适应) -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                        <h3 class="text-xs sm:text-sm font-bold text-slate-800">配对记录明细</h3>
                        <span class="text-[11px] text-slate-400">按时间倒序</span>
                    </div>

                    <!-- 1. 移动端：精致卡片视图 (sm:hidden) -->
                    <div class="block sm:hidden divide-y divide-slate-100">
                        ${currentData.map((pair, idx) => `
                            <div class="p-3.5 space-y-2">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-5 h-5 rounded-full bg-slate-100 text-slate-500 text-[10px] font-mono flex items-center justify-center">${idx + 1}</span>
                                        ${pair.direction === 'local_to_gist'
                                            ? '<span class="px-2 py-0.5 rounded text-[10px] bg-blue-50 text-blue-600 font-medium">本地 ➔ 云端</span>'
                                            : '<span class="px-2 py-0.5 rounded text-[10px] bg-purple-50 text-purple-600 font-medium">云端 ➔ 本地</span>'
                                        }
                                        ${pair.isCrossDay ? '<span class="px-1.5 py-0.5 rounded text-[9px] bg-indigo-50 text-indigo-600 font-bold">隔天/深夜</span>' : ''}
                                    </div>
                                    <span class="px-2 py-0.5 rounded-full text-xs font-bold ${pair.durationMinutes > 180 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-700'}">
                                        ${formatMinutes(pair.durationMinutes)}
                                    </span>
                                </div>
                                <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                                    <div class="bg-slate-50 p-2 rounded-xl">
                                        <span class="text-[10px] text-slate-400 block">开始 (${pair.direction === 'local_to_gist' ? '本地' : '云端'})</span>
                                        <p class="font-mono text-[11px] font-semibold mt-0.5">${pair.start.time.slice(5)}</p>
                                        <p class="text-[10px] text-slate-500 truncate">${pair.start.remark || '无备注'}</p>
                                    </div>
                                    <div class="bg-slate-50 p-2 rounded-xl">
                                        <span class="text-[10px] text-slate-400 block">结束 (${pair.direction === 'local_to_gist' ? '云端' : '本地'})</span>
                                        <p class="font-mono text-[11px] font-semibold mt-0.5">${pair.end.time.slice(5)}</p>
                                        <p class="text-[10px] text-slate-500 truncate">${pair.end.remark || '无备注'}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- 2. 桌面端：标准表格视图 (hidden sm:block) -->
                    <div class="hidden sm:block overflow-x-auto">
                        <table class="w-full text-left text-xs sm:text-sm">
                            <thead class="bg-slate-50 text-slate-500 uppercase text-[11px]">
                                <tr>
                                    <th class="p-3.5 w-12 text-center">#</th>
                                    <th class="p-3.5">时序流向</th>
                                    <th class="p-3.5">开始打卡</th>
                                    <th class="p-3.5">结束打卡</th>
                                    <th class="p-3.5 text-center">历时间隔</th>
                                    <th class="p-3.5 text-right">跨天属性</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-slate-700">
                                ${currentData.map((pair, idx) => `
                                    <tr class="hover:bg-slate-50/80 transition-colors">
                                        <td class="p-3.5 text-center text-slate-400 font-mono text-xs">${idx + 1}</td>
                                        <td class="p-3.5">
                                            ${pair.direction === 'local_to_gist'
                                                ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] bg-blue-50 text-blue-600 font-medium">本地 <i class="fa fa-arrow-right text-[9px]"></i> 云端</span>'
                                                : '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] bg-purple-50 text-purple-600 font-medium">云端 <i class="fa fa-arrow-right text-[9px]"></i> 本地</span>'
                                            }
                                        </td>
                                        <td class="p-3.5">
                                            <div class="font-mono font-medium">${pair.start.time}</div>
                                            <div class="text-[11px] text-slate-400 truncate max-w-[140px]">${pair.start.remark || '无备注'}</div>
                                        </td>
                                        <td class="p-3.5">
                                            <div class="font-mono font-medium text-slate-900">${pair.end.time}</div>
                                            <div class="text-[11px] text-slate-400 truncate max-w-[140px]">${pair.end.remark || '无备注'}</div>
                                        </td>
                                        <td class="p-3.5 text-center">
                                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${pair.durationMinutes > 180 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-700'}">
                                                ${formatMinutes(pair.durationMinutes)}
                                            </span>
                                        </td>
                                        <td class="p-3.5 text-right">
                                            ${pair.isCrossDay
                                                ? '<span class="px-2 py-0.5 rounded text-[10px] bg-indigo-50 text-indigo-600 font-semibold">隔天/跨午夜</span>'
                                                : '<span class="text-slate-400 text-xs">当日完成</span>'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            renderChart(currentData);
        }

        // --- 绘制折线图表 ---
        function renderChart(dataPairs) {
            const ctx = document.getElementById('interval-chart');
            if (!ctx) return;

            if (chartInstance) {
                chartInstance.destroy();
            }

            const chronologicalData = [...dataPairs].reverse();
            const labels = chronologicalData.map(p => p.start.time.slice(5, 16));
            const values = chronologicalData.map(p => p.durationMinutes);

            chartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '历时时长 (分钟)',
                        data: values,
                        borderColor: '#10B981',
                        backgroundColor: 'rgba(16, 185, 129, 0.12)',
                        borderWidth: 2,
                        pointBackgroundColor: '#10B981',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 1.5,
                        pointRadius: 3.5,
                        pointHoverRadius: 5,
                        tension: 0.35,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 9 }, color: '#94a3b8', maxRotation: 45 }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(226, 232, 240, 0.6)' },
                            ticks: {
                                font: { size: 9 },
                                color: '#94a3b8',
                                callback: function(val) { return val + 'm'; }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    return ` 耗时: ${formatMinutes(ctx.raw)}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- 切换筛选维度 ---
        function switchFilter(filterKey) {
            currentFilter = filterKey;
            renderHealthDashboard();
        }

        // --- 启动初始化 ---
        document.addEventListener('DOMContentLoaded', () => {
            if (loadConfig()) {
                fetchRecordsAndProcess();
            }
        });
    </script>
</body>
</html>
